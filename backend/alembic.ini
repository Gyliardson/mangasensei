[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
path_separator = os
# Dev-only fallback. Production always passes the URL explicitly
# (e.g. `mangasensei migrate` reads MANGASENSEI_DATABASE_URL; docker compose
# overrides it via the POSTGRES_PASSWORD interpolation in compose.yaml).
sqlalchemy.url = postgresql+psycopg://mangasensei:change-me@127.0.0.1:5432/mangasensei

[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
