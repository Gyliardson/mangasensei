x-app-service: &app-service
  image: mangasensei:${MANGASENSEI_VERSION:-dev}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      MANGASENSEI_VERSION: ${MANGASENSEI_VERSION:-dev}
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777

services:
  postgres:
    image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    environment:
      POSTGRES_DB: mangasensei
      POSTGRES_USER: mangasensei
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mangasensei -d mangasensei"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  models:
    <<: *app-service
    command: ["mangasensei", "models", "download"]
    environment:
      MANGASENSEI_ENVIRONMENT: production
      MANGASENSEI_MODEL_CACHE: /app/var/models
    volumes:
      - ocr_models:/app/var/models
    healthcheck:
      disable: true

  jmdict:
    <<: *app-service
    command:
      - sh
      - -c
      - >-
        mangasensei jmdict download &&
        mangasensei jmdict download --language de
    environment:
      MANGASENSEI_ENVIRONMENT: production
      MANGASENSEI_JMDICT_PATH: /app/var/data/jmdict.json
    volumes:
      - jmdict_data:/app/var/data
    healthcheck:
      disable: true

  migrate:
    <<: *app-service
    command: ["mangasensei", "migrate"]
    environment:
      MANGASENSEI_ENVIRONMENT: production
      MANGASENSEI_DATABASE_URL: postgresql+psycopg://mangasensei:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/mangasensei
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true

  pdf-spool-init:
    <<: *app-service
    command:
      - python
      - -c
      - >-
        import time;
        from pathlib import Path;
        from mangasensei.pdf_imports.spool import PdfSpool;
        PdfSpool(Path("/app/var/pdf-spool"), Path("/app/var/pdf-renderer-output"));
        time.sleep(2147483647)
    environment:
      MANGASENSEI_ENVIRONMENT: production
      MANGASENSEI_PDF_SPOOL_ROOT: /app/var/pdf-spool
      MANGASENSEI_PDF_RENDERER_OUTPUT_ROOT: /app/var/pdf-renderer-output
    volumes:
      - pdf_spool_input:/app/var/pdf-spool
      - pdf_renderer_output:/app/var/pdf-renderer-output
    network_mode: none
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os,sys; from pathlib import Path; required=(Path('/app/var/pdf-spool/staging'),Path('/app/var/pdf-spool/requests'),Path('/app/var/pdf-spool/imports'),Path('/app/var/pdf-renderer-output/imports'),Path('/app/var/pdf-renderer-output/renderer')); sys.exit(0 if os.geteuid() == 10001 and all(path.is_dir() for path in required) else 1)
      interval: 2s
      timeout: 2s
      start_period: 1s
      retries: 10
    restart: unless-stopped

  api:
    <<: *app-service
    command: ["mangasensei", "api", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      MANGASENSEI_ENVIRONMENT: production
      MANGASENSEI_DATABASE_URL: postgresql+psycopg://mangasensei:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/mangasensei
      MANGASENSEI_STORAGE_ROOT: /app/var/storage
      MANGASENSEI_PDF_SPOOL_ROOT: /app/var/pdf-spool
      MANGASENSEI_FRONTEND_DIST: /app/frontend/dist
      MANGASENSEI_CAPABILITY_PEPPERS: ${MANGASENSEI_CAPABILITY_PEPPERS:?set MANGASENSEI_CAPABILITY_PEPPERS}
      MANGASENSEI_RETENTION_HOURS: "24"
    depends_on:
      migrate:
        condition: service_completed_successfully
      pdf-spool-init:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MANGASENSEI_PORT:-8000}:8000"
    volumes:
      - app_storage:/app/var/storage
      - pdf_spool_input:/app/var/pdf-spool
    restart: unless-stopped

  pdf-renderer:
    <<: *app-service
    command: ["mangasensei", "pdf-renderer"]
    user: "10002:10002"
    group_add:
      - "10001"
    environment:
      MANGASENSEI_ENVIRONMENT: production
      MANGASENSEI_PDF_SPOOL_ROOT: /app/var/pdf-spool
      MANGASENSEI_PDF_RENDERER_OUTPUT_ROOT: /app/var/pdf-renderer-output
    depends_on:
      pdf-spool-init:
        condition: service_healthy
    volumes:
      - pdf_spool_input:/app/var/pdf-spool:ro
      - pdf_renderer_output:/app/var/pdf-renderer-output
    network_mode: none
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 64
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os,sys; cmd=open('/proc/1/cmdline','rb').read(); sys.exit(0 if os.geteuid() == 10002 and b'mangasensei' in cmd and b'pdf-renderer' in cmd else 1)
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  pdf-importer:
    <<: *app-service
    command: ["mangasensei", "pdf-importer"]
    environment:
      MANGASENSEI_ENVIRONMENT: production
      MANGASENSEI_DATABASE_URL: postgresql+psycopg://mangasensei:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/mangasensei
      MANGASENSEI_STORAGE_ROOT: /app/var/storage
      MANGASENSEI_PDF_SPOOL_ROOT: /app/var/pdf-spool
      MANGASENSEI_PDF_RENDERER_OUTPUT_ROOT: /app/var/pdf-renderer-output
      MANGASENSEI_CAPABILITY_PEPPERS: ${MANGASENSEI_CAPABILITY_PEPPERS:?set MANGASENSEI_CAPABILITY_PEPPERS}
      MANGASENSEI_RETENTION_HOURS: "24"
    depends_on:
      migrate:
        condition: service_completed_successfully
      pdf-spool-init:
        condition: service_healthy
      pdf-renderer:
        condition: service_healthy
    volumes:
      - app_storage:/app/var/storage
      - pdf_spool_input:/app/var/pdf-spool
      - pdf_renderer_output:/app/var/pdf-renderer-output
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 64
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import sys; cmd=open('/proc/1/cmdline','rb').read(); sys.exit(0 if b'mangasensei' in cmd and b'pdf-importer' in cmd else 1)
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  worker:
    <<: *app-service
    command: ["mangasensei", "worker"]
    environment:
      MANGASENSEI_ENVIRONMENT: production
      MANGASENSEI_DATABASE_URL: postgresql+psycopg://mangasensei:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/mangasensei
      MANGASENSEI_STORAGE_ROOT: /app/var/storage
      MANGASENSEI_MODEL_CACHE: /app/var/models
      MANGASENSEI_JMDICT_PATH: /app/var/data/jmdict.json
      MANGASENSEI_WORKER_LEASE_SECONDS: "300"
      MANGASENSEI_GEMINI_MODEL: ${MANGASENSEI_GEMINI_MODEL:-gemini-3.6-flash}
      MANGASENSEI_GEMINI_DAILY_BUDGET_USD: ${MANGASENSEI_GEMINI_DAILY_BUDGET_USD:-5.00}
      MANGASENSEI_OCR_DEVICE: ${MANGASENSEI_OCR_DEVICE:-cpu}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      models:
        condition: service_completed_successfully
      jmdict:
        condition: service_completed_successfully
    volumes:
      - app_storage:/app/var/storage
      - ocr_models:/app/var/models:ro
      - jmdict_data:/app/var/data:ro
    shm_size: 1gb
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import sys; cmd=open('/proc/1/cmdline','rb').read(); sys.exit(0 if b'mangasensei' in cmd and b'worker' in cmd else 1)
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  retention:
    <<: *app-service
    command: ["mangasensei", "retention"]
    environment:
      MANGASENSEI_ENVIRONMENT: production
      MANGASENSEI_DATABASE_URL: postgresql+psycopg://mangasensei:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/mangasensei
      MANGASENSEI_STORAGE_ROOT: /app/var/storage
      MANGASENSEI_RETENTION_HOURS: "24"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - app_storage:/app/var/storage
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import sys; cmd=open('/proc/1/cmdline','rb').read(); sys.exit(0 if b'mangasensei' in cmd and b'retention' in cmd else 1)
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

volumes:
  app_storage:
  jmdict_data:
  ocr_models:
  pdf_spool_input:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=272m,uid=10001,gid=10001,mode=0750
  pdf_renderer_output:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=544m,uid=10001,gid=10001,mode=0710
  postgres_data:
