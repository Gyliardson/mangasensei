name: JMdict v2 metadata investigation

on:
  push:
    branches:
      - fix/26-jmdict-form-restrictions

permissions:
  contents: read

jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: "3.11"
          prune-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Derive normalized metadata from pinned source
        run: uv run python scripts/update_jmdict_manifest.py

      - name: Print derived normalized manifest section
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("backend/src/mangasensei/linguistics/jmdict_manifest.json").read_text())
          print(json.dumps(manifest["normalized"], sort_keys=True))
          PY
