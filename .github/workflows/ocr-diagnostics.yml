name: OCR Real-Manga Diagnostics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tests/test_real_manga_ocr_diagnostics.py"
      - "tests/fixtures/ocr/real_manga/**"
      - "backend/src/mangasensei/ocr/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ocr-diagnostics.yml"

permissions:
  contents: read

concurrency:
  group: ocr-real-manga-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Short vertical text pipeline stages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MANGASENSEI_MODEL_CACHE: ${{ github.workspace }}/var/models
      MANGASENSEI_RUN_OCR_DIAGNOSTIC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: "3.11"
          prune-cache: true

      - name: Install locked OCR dependencies
        run: uv sync --frozen --extra ocr

      - name: Download reviewed OCR models
        run: uv run mangasensei models download

      - name: Verify reviewed OCR models
        run: uv run mangasensei models verify

      - name: Characterize detector, recognizer threshold and merge stages
        run: uv run pytest tests/test_real_manga_ocr_diagnostics.py -m ocr_smoke -vv -s --maxfail=1
