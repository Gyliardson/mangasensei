name: Reading Order v2 manifest SHA-256 report

on:
  push:
    branches:
      - automation/reading-order-v2-heldout-authoring

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact frozen PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e7edc5349901ab1607cfe8f7018a915946687a90
      - name: Print exact SHA-256
        run: sha256sum assets/reading-order-v2/heldout-v1/manifest.json
