name: PDF lock bootstrap

on:
  push:
    branches: [feat/105-hardened-pdf-import]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/105-hardened-pdf-import

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: "3.11"
          prune-cache: true

      - name: Regenerate lockfile with official uv
        run: |
          uv lock
          uv lock --check

      - name: Commit generated lockfile when changed
        run: |
          if git diff --quiet -- uv.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "build(pdf): regenerate uv lock"
          git push origin HEAD:feat/105-hardened-pdf-import

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdf-uv-lock
          path: uv.lock
          if-no-files-found: error
