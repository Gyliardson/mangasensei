name: PDF Import

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/pdf-import.yml"
      - "Dockerfile"
      - "compose.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "backend/migrations/**"
      - "backend/src/mangasensei/api/**"
      - "backend/src/mangasensei/application/pdf_imports.py"
      - "backend/src/mangasensei/config.py"
      - "backend/src/mangasensei/domain/capabilities.py"
      - "backend/src/mangasensei/infrastructure/database/**"
      - "backend/src/mangasensei/pdf_imports/**"
      - "backend/src/mangasensei/runtime.py"
      - "backend/src/mangasensei/cli.py"
      - "frontend/src/**"
      - "frontend/e2e-pdf-fullstack/**"
      - "frontend/playwright.pdf-fullstack.config.ts"
      - "tests/fixtures/**"
      - "tests/fullstack/**"
      - "tests/integration/test_pdf_imports.py"
      - "tests/integration/test_pdf_import_review_fixes.py"
      - "tests/unit/test_pdf_*.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-import-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: PDF contract and focused tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_DB: mangasensei
          POSTGRES_USER: mangasensei
          POSTGRES_PASSWORD: mangasensei
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U mangasensei -d mangasensei"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MANGASENSEI_TEST_DATABASE_URL: postgresql+psycopg://mangasensei:mangasensei@127.0.0.1:55432/mangasensei
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: "3.11"
          prune-cache: true
      - name: Install exact locked runtime
        run: uv sync --frozen --no-build-package pypdfium2
      - name: Verify reviewed PDFium wheels, native hashes and runtime identity
        run: |
          uv run python - <<'PY'
          import hashlib
          import json
          import platform
          import shutil
          import sys
          import urllib.request
          import zipfile
          from pathlib import Path

          import pypdfium2_raw
          from mangasensei.pdf_imports.native_provenance import (
              PDFIUM_NATIVE_SHA256_BY_PLATFORM,
              PYPDFIUM2_WHEEL_SHA256_BY_PLATFORM,
          )
          from mangasensei.pdf_imports.renderer import renderer_provenance
          from pypdfium2.version import PDFIUM_INFO, PYPDFIUM_INFO

          assert sys.version_info[:2] == (3, 11)
          assert platform.system() == "Linux"
          assert platform.machine().lower() == "x86_64"
          provenance = renderer_provenance()
          assert provenance.pypdfium2 == "5.12.1"
          assert provenance.pdfium_build == 7947
          assert provenance.pdfium_flags == ()
          assert PYPDFIUM_INFO.tag == "5.12.1"
          assert PDFIUM_INFO.build == 7947
          assert "V8" not in PDFIUM_INFO.flags
          assert "XFA" not in PDFIUM_INFO.flags

          raw_root = Path(pypdfium2_raw.__file__).resolve().parent
          native = raw_root / "libpdfium.so"
          runtime_sha256 = hashlib.sha256(native.read_bytes()).hexdigest()
          assert runtime_sha256 == PDFIUM_NATIVE_SHA256_BY_PLATFORM[("Linux", "x86_64")]
          site_packages = raw_root.parent
          license_candidates = sorted(
              path for path in site_packages.rglob("*") if path.name.startswith("BUILD_LICENSES")
          )
          assert license_candidates, "installed binary wheel did not expose BUILD_LICENSES"
          target = Path("/tmp/pdfium-licenses")
          runtime_target = target / "runtime-x86_64"
          runtime_target.mkdir(parents=True)
          for index, candidate in enumerate(license_candidates):
              destination = runtime_target / f"{index:02d}-{candidate.name}"
              if candidate.is_dir():
                  shutil.copytree(candidate, destination)
              else:
                  shutil.copy2(candidate, destination)
              print("runtime license", candidate.relative_to(site_packages))

          reviewed_wheels = {
              ("Linux", "x86_64"): "pypdfium2-5.12.1-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl",
              ("Linux", "aarch64"): "pypdfium2-5.12.1-py3-none-manylinux_2_17_aarch64.manylinux2014_aarch64.whl",
          }
          with urllib.request.urlopen(
              "https://pypi.org/pypi/pypdfium2/5.12.1/json", timeout=30
          ) as response:
              release = json.load(response)
          by_filename = {item["filename"]: item for item in release["urls"]}
          lock = Path("uv.lock").read_text()
          evidence = []
          for key, filename in reviewed_wheels.items():
              item = by_filename[filename]
              expected_wheel_sha256 = PYPDFIUM2_WHEEL_SHA256_BY_PLATFORM[key]
              expected_native_sha256 = PDFIUM_NATIVE_SHA256_BY_PLATFORM[key]
              assert item["packagetype"] == "bdist_wheel"
              assert item["digests"]["sha256"] == expected_wheel_sha256
              assert expected_wheel_sha256 in lock
              with urllib.request.urlopen(item["url"], timeout=60) as response:
                  payload = response.read()
              assert hashlib.sha256(payload).hexdigest() == expected_wheel_sha256
              wheel_path = Path("/tmp") / filename
              wheel_path.write_bytes(payload)
              with zipfile.ZipFile(wheel_path) as archive:
                  bundled_native = archive.read("pypdfium2_raw/libpdfium.so")
                  native_sha256 = hashlib.sha256(bundled_native).hexdigest()
                  assert native_sha256 == expected_native_sha256
                  license_files = sorted(
                      name
                      for name in archive.namelist()
                      if "/BUILD_LICENSES/" in name and not name.endswith("/")
                  )
                  assert license_files, f"{filename} did not include BUILD_LICENSES"
                  wheel_license_target = target / "reviewed-wheels" / key[1]
                  wheel_license_target.mkdir(parents=True)
                  for name in license_files:
                      (wheel_license_target / Path(name).name).write_bytes(archive.read(name))
              entry = {
                  "platform": key[0],
                  "machine": key[1],
                  "filename": filename,
                  "wheel_sha256": expected_wheel_sha256,
                  "native_sha256": native_sha256,
              }
              evidence.append(entry)
              print(json.dumps(entry, sort_keys=True))

          (target / "reviewed-wheel-provenance.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n"
          )
          print("runtime", provenance.model_dump_json())
          print("runtime_native_sha256", runtime_sha256)
          PY
          native="$(uv run python -c 'from pathlib import Path; import pypdfium2_raw; print(Path(pypdfium2_raw.__file__).resolve().parent / "libpdfium.so")')"
          ldd "${native}" | tee /tmp/pdfium-ldd.txt
          ! grep -q "not found" /tmp/pdfium-ldd.txt
          grep -q -- "--no-build-package pypdfium2" Dockerfile
      - name: Upload exact bundled license evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdfium-build-licenses
          path: /tmp/pdfium-licenses
          if-no-files-found: error
      - name: Run focused PDF tests
        run: >-
          uv run pytest
          tests/unit/test_pdf_renderer.py
          tests/unit/test_pdf_renderer_process.py
          tests/unit/test_pdf_renderer_security.py
          tests/unit/test_pdf_spool.py
          tests/unit/test_pdf_import_security.py
          tests/integration/test_pdf_imports.py
          tests/integration/test_pdf_import_review_fixes.py
          -q

  container:
    name: Split-channel renderer trust boundary
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: pdf-container-ci
      MANGASENSEI_CAPABILITY_PEPPERS: '["pdf-container-ci-capability-pepper-000000001"]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build production image
        run: docker build --build-arg MANGASENSEI_VERSION="$(cat VERSION)" -t mangasensei:dev .
      - name: Verify normalized Compose topology
        run: |
          docker compose config --format json > /tmp/compose.json
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          def memory_bytes(value: object) -> int:
              if isinstance(value, int):
                  return value
              if not isinstance(value, str):
                  raise AssertionError(("unexpected mem_limit type", value))
              normalized = value.strip().lower()
              if normalized.isdecimal():
                  return int(normalized)
              match = re.fullmatch(r"([0-9]+)([kmgt])(?:i?b)?", normalized)
              if match is None:
                  raise AssertionError(("unexpected mem_limit value", value))
              units = {"k": 1, "m": 2, "g": 3, "t": 4}
              return int(match.group(1)) * 1024 ** units[match.group(2)]

          services = json.loads(Path("/tmp/compose.json").read_text())["services"]
          renderer = services["pdf-renderer"]
          anchor = services["pdf-spool-init"]
          api = services["api"]
          importer = services["pdf-importer"]
          print(json.dumps(renderer, indent=2, sort_keys=True))
          print(json.dumps(anchor, indent=2, sort_keys=True))

          assert renderer["user"] == "10002:10002"
          assert renderer["group_add"] == ["10001"]
          assert renderer["network_mode"] == "none"
          assert renderer["read_only"] is True
          assert renderer["cap_drop"] == ["ALL"]
          assert "no-new-privileges:true" in renderer["security_opt"]
          assert memory_bytes(renderer["mem_limit"]) == 1024 ** 3
          assert float(renderer["cpus"]) == 1.0
          assert renderer["pids_limit"] == 64
          assert any("/tmp" in item and "128m" in item for item in renderer["tmpfs"])
          assert anchor["network_mode"] == "none"
          assert anchor["read_only"] is True
          assert anchor["cap_drop"] == ["ALL"]
          assert "no-new-privileges:true" in anchor["security_opt"]

          for service in (renderer, anchor):
              environment = service.get("environment", {})
              for forbidden in (
                  "MANGASENSEI_DATABASE_URL",
                  "MANGASENSEI_CAPABILITY_PEPPERS",
                  "GOOGLE_API_KEY",
                  "MANGASENSEI_JMDICT_PATH",
                  "MANGASENSEI_MODEL_CACHE",
                  "MANGASENSEI_STORAGE_ROOT",
              ):
                  assert forbidden not in environment

          def mounts(service: dict[str, object]) -> dict[str, dict[str, object]]:
              result: dict[str, dict[str, object]] = {}
              for mount in service.get("volumes", []):
                  assert isinstance(mount, dict)
                  result[str(mount["target"])] = mount
              return result

          renderer_mounts = mounts(renderer)
          anchor_mounts = mounts(anchor)
          api_mounts = mounts(api)
          importer_mounts = mounts(importer)
          assert set(renderer_mounts) == {
              "/app/var/pdf-spool",
              "/app/var/pdf-renderer-output",
          }
          assert renderer_mounts["/app/var/pdf-spool"]["read_only"] is True
          assert renderer_mounts["/app/var/pdf-renderer-output"].get("read_only", False) is False
          assert "/app/var/storage" not in renderer_mounts
          assert set(anchor_mounts) == {
              "/app/var/pdf-spool",
              "/app/var/pdf-renderer-output",
          }
          assert all(not mount.get("read_only", False) for mount in anchor_mounts.values())
          assert "/app/var/storage" not in anchor_mounts
          assert "/app/var/pdf-renderer-output" not in api_mounts
          assert api_mounts["/app/var/pdf-spool"].get("read_only", False) is False
          assert importer_mounts["/app/var/pdf-spool"].get("read_only", False) is False
          assert importer_mounts["/app/var/pdf-renderer-output"].get("read_only", False) is False
          assert importer_mounts["/app/var/storage"].get("read_only", False) is False
          assert "docker.sock" not in json.dumps(renderer_mounts)
          assert "docker.sock" not in json.dumps(anchor_mounts)
          PY
      - name: Upload normalized Compose evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdf-renderer-compose-config
          path: /tmp/compose.json
          if-no-files-found: error
      - name: Start trusted spool anchor and renderer
        run: |
          docker compose up --no-deps -d pdf-spool-init
          for attempt in $(seq 1 30); do
            anchor="$(docker compose ps -q pdf-spool-init)"
            if test -n "${anchor}" \
              && test "$(docker inspect --format '{{.State.Health.Status}}' "${anchor}")" = healthy; then
              break
            fi
            if test "${attempt}" = "30"; then
              docker compose logs pdf-spool-init
              exit 1
            fi
            sleep 1
          done
          docker compose up --no-deps -d pdf-renderer
          for attempt in $(seq 1 30); do
            container="$(docker compose ps -q pdf-renderer)"
            if test -n "${container}" \
              && test "$(docker inspect --format '{{.State.Health.Status}}' "${container}")" = healthy; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs pdf-spool-init pdf-renderer
          exit 1
      - name: Prove runtime identity, hardening and network denial
        run: |
          anchor="$(docker compose ps -q pdf-spool-init)"
          container="$(docker compose ps -q pdf-renderer)"
          test "$(docker exec "${anchor}" id -u)" = "10001"
          test "$(docker exec "${anchor}" id -g)" = "10001"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "${anchor}")" = "true"
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' "${anchor}")" = "none"
          test "$(docker exec "${container}" id -u)" = "10002"
          test "$(docker exec "${container}" id -g)" = "10002"
          docker exec "${container}" sh -c 'id -G | tr " " "\n" | grep -qx 10001'
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "${container}")" = "true"
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' "${container}")" = "none"
          test "$(docker inspect --format '{{.HostConfig.Memory}}' "${container}")" = "1073741824"
          test "$(docker inspect --format '{{.HostConfig.PidsLimit}}' "${container}")" = "64"
          docker exec -i "${container}" python - <<'PY'
          import socket
          from pathlib import Path

          status = Path("/proc/self/status").read_text()
          assert "NoNewPrivs:\t1" in status
          assert "CapEff:\t0000000000000000" in status
          socket.setdefaulttimeout(1)
          try:
              socket.getaddrinfo("pypi.org", 443)
          except OSError:
              pass
          else:
              raise SystemExit("renderer unexpectedly resolved outbound DNS")
          try:
              socket.create_connection(("1.1.1.1", 443), timeout=1)
          except OSError:
              pass
          else:
              raise SystemExit("renderer unexpectedly opened outbound TCP")
          PY
      - name: Prove renderer cannot mutate trusted channels or escape through symlink
        run: |
          import_id=11111111-1111-4111-8111-111111111111
          fence=1
          docker compose run --rm --no-deps -T --entrypoint python pdf-importer - <<PY
          from pathlib import Path
          from uuid import UUID
          from mangasensei.pdf_imports.spool import PdfSpool

          import_id = UUID("${import_id}")
          spool = PdfSpool(Path("/app/var/pdf-spool"), Path("/app/var/pdf-renderer-output"))
          spool.prepare_import_dir(import_id)
          spool.write_bytes_exclusive(spool.source_path(import_id), b"trusted-source")
          spool.prepare_attempt_dir(import_id, ${fence})
          spool.write_bytes_exclusive(spool.request_path(import_id, ${fence}), b"trusted-request")
          PY

          docker compose run --rm --no-deps -T --entrypoint sh api -c \
            'printf "trusted-storage-sentinel" > /app/var/storage/security-sentinel'

          container="$(docker compose ps -q pdf-renderer)"
          if docker exec "${container}" sh -c \
            "printf compromised > /app/var/pdf-spool/imports/${import_id}/source.pdf"; then
            echo "renderer mutated coordinator-owned source" >&2
            exit 1
          fi
          if docker exec "${container}" sh -c \
            "rm /app/var/pdf-spool/requests/${import_id}.${fence}.request.json"; then
            echo "renderer deleted coordinator-owned request" >&2
            exit 1
          fi
          if docker exec "${container}" sh -c \
            "mv /app/var/pdf-renderer-output/imports/${import_id}/attempt-${fence} /app/var/pdf-renderer-output/imports/${import_id}/attempt-${fence}-owned"; then
            echo "renderer replaced trusted attempt topology" >&2
            exit 1
          fi
          docker exec "${container}" ln -s \
            /app/var/storage/security-sentinel \
            "/app/var/pdf-renderer-output/imports/${import_id}/attempt-${fence}/page-000001.png"

          docker compose run --rm --no-deps -T --entrypoint python pdf-importer - <<PY
          from pathlib import Path
          from uuid import UUID
          from mangasensei.pdf_imports.spool import PdfSpool, PdfSpoolError

          import_id = UUID("${import_id}")
          spool = PdfSpool(Path("/app/var/pdf-spool"), Path("/app/var/pdf-renderer-output"))
          page = spool.page_path(import_id, ${fence}, "page-000001.png")
          try:
              spool.read_bytes(page, max_bytes=1024)
          except PdfSpoolError:
              pass
          else:
              raise SystemExit("renderer-authored storage symlink was followed")
          sentinel = Path("/app/var/storage/security-sentinel")
          assert sentinel.read_bytes() == b"trusted-storage-sentinel"
          spool.remove_import(import_id)
          assert sentinel.read_bytes() == b"trusted-storage-sentinel"
          PY
      - name: Stop renderer
        if: always()
        run: docker compose down --volumes --remove-orphans

  fullstack:
    name: PDF full-stack browser flow (split renderer channels)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_DB: mangasensei
          POSTGRES_USER: mangasensei
          POSTGRES_PASSWORD: mangasensei
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U mangasensei -d mangasensei"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MANGASENSEI_DATABASE_URL: postgresql+psycopg://mangasensei:mangasensei@127.0.0.1:55432/mangasensei
      MANGASENSEI_STORAGE_ROOT: /tmp/mangasensei-pdf-fullstack-storage
      MANGASENSEI_PDF_SPOOL_ROOT: /tmp/mangasensei-pdf-fullstack-spool-input
      MANGASENSEI_FRONTEND_DIST: /opt/mangasensei-pdf-ci/harness/frontend
      MANGASENSEI_CAPABILITY_PEPPERS: '["pdf-fullstack-capability-pepper-000000000001"]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install frontend and build
        run: npm ci && npm run build
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
        working-directory: frontend
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: "3.11"
          prune-cache: true
      - name: Install self-contained cross-UID PDF harness
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0755 \
            /opt/mangasensei-pdf-ci \
            /opt/mangasensei-pdf-ci/harness \
            /opt/mangasensei-pdf-ci/harness/fullstack \
            /opt/mangasensei-pdf-ci/harness/fullstack/fixtures \
            /opt/mangasensei-pdf-ci/harness/frontend
          UV_PYTHON_INSTALL_DIR=/opt/mangasensei-pdf-ci/python uv python install 3.11
          python_bin="$(UV_PYTHON_INSTALL_DIR=/opt/mangasensei-pdf-ci/python uv python find 3.11)"
          UV_PROJECT_ENVIRONMENT=/opt/mangasensei-pdf-ci/venv \
            UV_PYTHON_INSTALL_DIR=/opt/mangasensei-pdf-ci/python \
            uv sync --frozen --python "${python_bin}" --no-editable --no-build-package pypdfium2
          install -m 0644 tests/fullstack/worker.py /opt/mangasensei-pdf-ci/harness/fullstack/worker.py
          cp -a tests/fullstack/fixtures/. /opt/mangasensei-pdf-ci/harness/fullstack/fixtures/
          cp -a frontend/dist/. /opt/mangasensei-pdf-ci/harness/frontend/
          sudo chmod -R a+rX /opt/mangasensei-pdf-ci
          grep -q "/opt/mangasensei-pdf-ci/python" /opt/mangasensei-pdf-ci/venv/pyvenv.cfg
          sudo setpriv --reuid=10001 --regid=10001 --clear-groups \
            /opt/mangasensei-pdf-ci/venv/bin/python -c \
            'from pathlib import Path; import encodings, mangasensei; assert Path("/opt/mangasensei-pdf-ci/harness/fullstack/worker.py").is_file(); assert Path("/opt/mangasensei-pdf-ci/harness/fullstack/fixtures/jmdict.json").is_file(); assert Path("/opt/mangasensei-pdf-ci/harness/frontend/index.html").is_file(); print("cross-uid PDF runtime ready")'
      - name: Start real split-channel PDF import and study runtime
        run: |
          output_root=/tmp/mangasensei-pdf-fullstack-renderer-output
          rm -rf "${MANGASENSEI_STORAGE_ROOT}" "${MANGASENSEI_PDF_SPOOL_ROOT}" "${output_root}"
          sudo install -d -o 10001 -g 10001 -m 0700 "${MANGASENSEI_STORAGE_ROOT}"
          sudo install -d -o 10001 -g 10001 -m 0750 "${MANGASENSEI_PDF_SPOOL_ROOT}"
          sudo install -d -o 10001 -g 10001 -m 0710 "${output_root}"
          harness_python=/opt/mangasensei-pdf-ci/venv/bin/python
          "${harness_python}" -c \
            'from mangasensei.cli import main; raise SystemExit(main(["migrate"]))'
          sudo --preserve-env=MANGASENSEI_PDF_SPOOL_ROOT \
            env MANGASENSEI_PDF_RENDERER_OUTPUT_ROOT="${output_root}" \
            setpriv --reuid=10001 --regid=10001 --clear-groups \
            "${harness_python}" - <<'PY'
          import os
          from pathlib import Path
          from mangasensei.pdf_imports.spool import PdfSpool

          PdfSpool(
              Path(os.environ["MANGASENSEI_PDF_SPOOL_ROOT"]),
              Path(os.environ["MANGASENSEI_PDF_RENDERER_OUTPUT_ROOT"]),
          )
          PY
          docker build --build-arg MANGASENSEI_VERSION="$(cat VERSION)" -t mangasensei:pdf-fullstack .
          docker rm -f mangasensei-pdf-renderer-e2e >/dev/null 2>&1 || true
          docker run --detach --name mangasensei-pdf-renderer-e2e \
            --user 10002:10002 \
            --group-add 10001 \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --memory 1g \
            --cpus 1 \
            --pids-limit 64 \
            --tmpfs /tmp:rw,size=128m,mode=1777 \
            --mount "type=bind,src=${MANGASENSEI_PDF_SPOOL_ROOT},dst=/app/var/pdf-spool,readonly" \
            --mount "type=bind,src=${output_root},dst=/app/var/pdf-renderer-output" \
            -e MANGASENSEI_ENVIRONMENT=production \
            -e MANGASENSEI_PDF_SPOOL_ROOT=/app/var/pdf-spool \
            -e MANGASENSEI_PDF_RENDERER_OUTPUT_ROOT=/app/var/pdf-renderer-output \
            mangasensei:pdf-fullstack mangasensei pdf-renderer >/dev/null
          sudo --preserve-env=MANGASENSEI_DATABASE_URL,MANGASENSEI_STORAGE_ROOT,MANGASENSEI_PDF_SPOOL_ROOT,MANGASENSEI_FRONTEND_DIST,MANGASENSEI_CAPABILITY_PEPPERS \
            setpriv --reuid=10001 --regid=10001 --clear-groups \
            "${harness_python}" -c \
            'from mangasensei.cli import main; raise SystemExit(main(["api", "--host", "127.0.0.1", "--port", "8000"]))' \
            > "${RUNNER_TEMP}/pdf-api.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/pdf-api.pid"
          sudo --preserve-env=MANGASENSEI_DATABASE_URL,MANGASENSEI_STORAGE_ROOT,MANGASENSEI_PDF_SPOOL_ROOT,MANGASENSEI_FRONTEND_DIST,MANGASENSEI_CAPABILITY_PEPPERS \
            setpriv --reuid=10001 --regid=10001 --clear-groups \
            "${harness_python}" /opt/mangasensei-pdf-ci/harness/fullstack/worker.py \
            > "${RUNNER_TEMP}/pdf-worker.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/pdf-worker.pid"
          sudo --preserve-env=MANGASENSEI_DATABASE_URL,MANGASENSEI_STORAGE_ROOT,MANGASENSEI_PDF_SPOOL_ROOT,MANGASENSEI_FRONTEND_DIST,MANGASENSEI_CAPABILITY_PEPPERS \
            env MANGASENSEI_PDF_RENDERER_OUTPUT_ROOT="${output_root}" \
            setpriv --reuid=10001 --regid=10001 --clear-groups \
            "${harness_python}" -c \
            'from mangasensei.cli import main; raise SystemExit(main(["pdf-importer"]))' \
            > "${RUNNER_TEMP}/pdf-importer.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/pdf-importer.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null \
              && docker exec mangasensei-pdf-renderer-e2e test -f /app/var/pdf-renderer-output/renderer/heartbeat.json; then
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/pdf-api.log" || true
          cat "${RUNNER_TEMP}/pdf-importer.log" || true
          docker logs mangasensei-pdf-renderer-e2e || true
          exit 1
      - name: Prove browser-flow renderer split isolation
        run: |
          test "$(docker exec mangasensei-pdf-renderer-e2e id -u)" = "10002"
          test "$(docker exec mangasensei-pdf-renderer-e2e id -g)" = "10002"
          docker exec mangasensei-pdf-renderer-e2e sh -c 'id -G | tr " " "\n" | grep -qx 10001'
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' mangasensei-pdf-renderer-e2e)" = "true"
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' mangasensei-pdf-renderer-e2e)" = "none"
          test "$(docker inspect --format '{{.HostConfig.Memory}}' mangasensei-pdf-renderer-e2e)" = "1073741824"
          test "$(docker inspect --format '{{.HostConfig.PidsLimit}}' mangasensei-pdf-renderer-e2e)" = "64"
          python - <<'PY'
          import json
          import subprocess

          mounts = json.loads(subprocess.check_output([
              "docker", "inspect", "--format", "{{json .Mounts}}",
              "mangasensei-pdf-renderer-e2e",
          ]))
          by_destination = {mount["Destination"]: mount for mount in mounts}
          assert by_destination["/app/var/pdf-spool"]["RW"] is False
          assert by_destination["/app/var/pdf-renderer-output"]["RW"] is True
          assert "/app/var/storage" not in by_destination
          PY
          docker exec -i mangasensei-pdf-renderer-e2e python - <<'PY'
          from pathlib import Path

          status = Path("/proc/self/status").read_text()
          assert "NoNewPrivs:\t1" in status
          assert "CapEff:\t0000000000000000" in status
          PY
      - name: Run real browser-to-PDFium-to-Page flow
        run: npx --no-install playwright test --config frontend/playwright.pdf-fullstack.config.ts
      - name: Stop PDF full-stack runtime
        if: always()
        run: |
          docker logs mangasensei-pdf-renderer-e2e > "${RUNNER_TEMP}/pdf-renderer.log" 2>&1 || true
          docker rm -f mangasensei-pdf-renderer-e2e >/dev/null 2>&1 || true
          for name in pdf-api pdf-worker pdf-importer; do
            file="${RUNNER_TEMP}/${name}.pid"
            if test -f "${file}"; then sudo kill "$(cat "${file}")" 2>/dev/null || true; fi
          done
      - name: Upload PDF full-stack diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdf-fullstack-diagnostics
          path: |
            playwright-report-pdf-fullstack
            test-results-pdf-fullstack
            ${{ runner.temp }}/pdf-api.log
            ${{ runner.temp }}/pdf-worker.log
            ${{ runner.temp }}/pdf-renderer.log
            ${{ runner.temp }}/pdf-importer.log
          if-no-files-found: ignore
