name: Normalize license text

on:
  push:
    branches:
      - chore/license-detection

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Remove project preamble from LICENSE
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(head -n 1 LICENSE)" != "MangaSensei" ]]; then
            echo "LICENSE is already normalized"
            exit 0
          fi

          tail -n +6 LICENSE > LICENSE.tmp
          mv LICENSE.tmp LICENSE
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LICENSE
          git commit -m "chore: normalize GPL license text"
          git push origin "HEAD:${GITHUB_REF_NAME}"
