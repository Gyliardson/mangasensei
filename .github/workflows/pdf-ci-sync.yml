name: PDF CI synchronization

on:
  push:
    branches: [feat/105-hardened-pdf-import]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/105-hardened-pdf-import

      - name: Integrate PDF gates into required CI
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text()

          def replace(old: str, new: str) -> None:
              global text
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'CI anchor missing: {old[:120]!r}')

          replace(
              '          app_roles = ("api", "worker", "retention", "models", "jmdict", "migrate")\n',
              '          app_roles = (\n              "api",\n              "pdf-renderer",\n              "pdf-importer",\n              "worker",\n              "retention",\n              "models",\n              "jmdict",\n              "migrate",\n          )\n',
          )
          replace(
              '          expected_database_consumers = {"api", "worker", "retention", "migrate"}\n',
              '          expected_database_consumers = {\n              "api", "pdf-importer", "worker", "retention", "migrate"\n          }\n',
          )
          replace(
              '          expected_capability_pepper_consumers = {"api"}\n',
              '          expected_capability_pepper_consumers = {"api", "pdf-importer"}\n',
          )
          renderer_checks = '''\n      - name: Prove hardened local PDF renderer boundary\n        run: |\n          container_name=mangasensei-pdf-renderer-ci\n          docker rm -f "${container_name}" >/dev/null 2>&1 || true\n          docker run --detach --name "${container_name}" \\\n            --network none \\\n            --read-only \\\n            --cap-drop ALL \\\n            --security-opt no-new-privileges \\\n            --memory 1g \\\n            --cpus 1 \\\n            --pids-limit 64 \\\n            --tmpfs /tmp:rw,size=128m,mode=1777 \\\n            --tmpfs /app/var/pdf-spool:rw,size=1g,mode=0700,uid=10001,gid=10001 \\\n            -e MANGASENSEI_ENVIRONMENT=test \\\n            -e MANGASENSEI_PDF_SPOOL_ROOT=/app/var/pdf-spool \\\n            mangasensei:ci mangasensei pdf-renderer >/dev/null\n          for attempt in $(seq 1 30); do\n            if docker exec "${container_name}" test -f /app/var/pdf-spool/renderer/heartbeat.json; then\n              break\n            fi\n            sleep 1\n          done\n          docker exec "${container_name}" python - <<'PY'\n          import os\n          import socket\n          from pathlib import Path\n          from mangasensei.pdf_imports.renderer import renderer_provenance\n\n          assert os.getuid() == 10001\n          status = Path('/proc/self/status').read_text()\n          assert 'NoNewPrivs:\\t1' in status\n          assert 'CapEff:\\t0000000000000000' in status\n          provenance = renderer_provenance()\n          assert provenance.pypdfium2 == '5.12.1'\n          assert provenance.pdfium_build == 7947\n          assert provenance.native_library == 'pypdfium2_raw/libpdfium.so'\n          Path('/app/var/pdf-spool/ci-write-proof').write_text('ok')\n          try:\n              Path('/app/ci-root-write-proof').write_text('forbidden')\n          except OSError:\n              pass\n          else:\n              raise SystemExit('renderer root filesystem was writable')\n          socket.setdefaulttimeout(1)\n          try:\n              socket.getaddrinfo('pypi.org', 443)\n          except OSError:\n              pass\n          else:\n              raise SystemExit('renderer unexpectedly resolved outbound DNS')\n          try:\n              socket.create_connection(('1.1.1.1', 443), timeout=1)\n          except OSError:\n              pass\n          else:\n              raise SystemExit('renderer unexpectedly opened outbound TCP')\n          PY\n          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "${container_name}")" = true\n          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' "${container_name}")" = none\n          test "$(docker inspect --format '{{.HostConfig.Memory}}' "${container_name}")" = 1073741824\n          test "$(docker inspect --format '{{.HostConfig.PidsLimit}}' "${container_name}")" = 64\n          docker exec "${container_name}" python - <<'PY'\n          from importlib import metadata\n          from pathlib import Path\n          import pypdfium2_raw\n\n          dist = metadata.distribution('pypdfium2_raw')\n          assert dist.version == '152.0.7947.0'\n          notices = [Path(dist.locate_file(item)) for item in dist.files or () if 'BUILD_LICENSES' in str(item)]\n          assert notices and all(path.exists() for path in notices)\n          raw_root = Path(pypdfium2_raw.__file__).resolve().parent\n          native = raw_root / 'libpdfium.so'\n          assert native.is_file() and native.resolve().is_relative_to(raw_root)\n          PY\n          docker rm -f "${container_name}" >/dev/null\n'''
          anchor = '          docker run --rm -e GOOGLE_API_KEY= --entrypoint python mangasensei:ci -c "from mangasensei.config import Settings; from mangasensei.runtime import _gemini_adapter; settings = Settings(_env_file=None); assert settings.google_api_key is None; assert _gemini_adapter(settings) is None"\n'
          if 'name: Prove hardened local PDF renderer boundary' not in text:
              if anchor not in text:
                  raise SystemExit('Docker renderer insertion anchor missing')
              text = text.replace(anchor, anchor + renderer_checks, 1)

          replace(
              '      MANGASENSEI_STORAGE_ROOT: /tmp/mangasensei-fullstack-storage\n      MANGASENSEI_FRONTEND_DIST: frontend/dist\n',
              '      MANGASENSEI_STORAGE_ROOT: /tmp/mangasensei-fullstack-storage\n      MANGASENSEI_PDF_SPOOL_ROOT: /tmp/mangasensei-pdf-fullstack-spool\n      MANGASENSEI_FRONTEND_DIST: frontend/dist\n',
          )
          replace(
              '      - name: Start real API, migrations and deterministic worker\n        run: |\n          uv run mangasensei migrate\n          uv run mangasensei api --host 127.0.0.1 --port 8000 > "${RUNNER_TEMP}/mangasensei-api.log" 2>&1 &\n          echo $! > "${RUNNER_TEMP}/mangasensei-api.pid"\n          uv run python tests/fullstack/worker.py > "${RUNNER_TEMP}/mangasensei-worker.log" 2>&1 &\n          echo $! > "${RUNNER_TEMP}/mangasensei-worker.pid"\n          for attempt in $(seq 1 60); do\n            if curl --fail --silent --show-error http://127.0.0.1:8000/ready > /dev/null; then\n              exit 0\n            fi\n            sleep 1\n          done\n          cat "${RUNNER_TEMP}/mangasensei-api.log"\n          cat "${RUNNER_TEMP}/mangasensei-worker.log"\n          exit 1\n',
              '      - name: Start real API, isolated PDF renderer, importer and deterministic worker\n        run: |\n          rm -rf "${MANGASENSEI_STORAGE_ROOT}" "${MANGASENSEI_PDF_SPOOL_ROOT}"\n          mkdir -p "${MANGASENSEI_PDF_SPOOL_ROOT}"\n          chmod 0770 "${MANGASENSEI_PDF_SPOOL_ROOT}"\n          uv run mangasensei migrate\n          docker build --build-arg MANGASENSEI_VERSION="$(cat VERSION)" -t mangasensei:pdf-fullstack .\n          docker rm -f mangasensei-pdf-renderer-e2e >/dev/null 2>&1 || true\n          docker run --detach --name mangasensei-pdf-renderer-e2e \\\n            --network none \\\n            --read-only \\\n            --cap-drop ALL \\\n            --security-opt no-new-privileges \\\n            --memory 1g \\\n            --cpus 1 \\\n            --pids-limit 64 \\\n            --tmpfs /tmp:rw,size=128m,mode=1777 \\\n            --group-add "$(id -g)" \\\n            --mount "type=bind,src=${MANGASENSEI_PDF_SPOOL_ROOT},dst=/app/var/pdf-spool" \\\n            -e MANGASENSEI_ENVIRONMENT=test \\\n            -e MANGASENSEI_PDF_SPOOL_ROOT=/app/var/pdf-spool \\\n            mangasensei:pdf-fullstack mangasensei pdf-renderer >/dev/null\n          uv run mangasensei api --host 127.0.0.1 --port 8000 > "${RUNNER_TEMP}/mangasensei-api.log" 2>&1 &\n          echo $! > "${RUNNER_TEMP}/mangasensei-api.pid"\n          uv run python tests/fullstack/worker.py > "${RUNNER_TEMP}/mangasensei-worker.log" 2>&1 &\n          echo $! > "${RUNNER_TEMP}/mangasensei-worker.pid"\n          uv run mangasensei pdf-importer > "${RUNNER_TEMP}/mangasensei-pdf-importer.log" 2>&1 &\n          echo $! > "${RUNNER_TEMP}/mangasensei-pdf-importer.pid"\n          for attempt in $(seq 1 60); do\n            if curl --fail --silent --show-error http://127.0.0.1:8000/ready > /dev/null \\\n              && test -f "${MANGASENSEI_PDF_SPOOL_ROOT}/renderer/heartbeat.json"; then\n              exit 0\n            fi\n            sleep 1\n          done\n          cat "${RUNNER_TEMP}/mangasensei-api.log" || true\n          cat "${RUNNER_TEMP}/mangasensei-worker.log" || true\n          cat "${RUNNER_TEMP}/mangasensei-pdf-importer.log" || true\n          docker logs mangasensei-pdf-renderer-e2e || true\n          exit 1\n',
          )
          replace(
              '      - name: Full-stack critical-flow E2E\n        run: npm run e2e:fullstack\n\n',
              '      - name: Full-stack critical-flow E2E\n        run: npm run e2e:fullstack\n\n      - name: Full-stack PDF import through isolated renderer\n        run: npx --no-install playwright test --config frontend/playwright.pdf-fullstack.config.ts\n\n',
          )
          replace(
              '          for pid_file in "${RUNNER_TEMP}/mangasensei-api.pid" "${RUNNER_TEMP}/mangasensei-worker.pid"; do\n',
              '          docker logs mangasensei-pdf-renderer-e2e > "${RUNNER_TEMP}/mangasensei-pdf-renderer.log" 2>&1 || true\n          docker rm -f mangasensei-pdf-renderer-e2e >/dev/null 2>&1 || true\n          for pid_file in "${RUNNER_TEMP}/mangasensei-api.pid" "${RUNNER_TEMP}/mangasensei-worker.pid" "${RUNNER_TEMP}/mangasensei-pdf-importer.pid"; do\n',
          )
          replace(
              '            test-results-fullstack\n            ${{ runner.temp }}/mangasensei-api.log\n            ${{ runner.temp }}/mangasensei-worker.log\n',
              '            test-results-fullstack\n            playwright-report-pdf-fullstack\n            test-results-pdf-fullstack\n            ${{ runner.temp }}/mangasensei-api.log\n            ${{ runner.temp }}/mangasensei-worker.log\n            ${{ runner.temp }}/mangasensei-pdf-importer.log\n            ${{ runner.temp }}/mangasensei-pdf-renderer.log\n',
          )

          path.write_text(text)
          PY

      - name: Validate workflow syntax shape
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/ci.yml').read_text()
          assert 'Prove hardened local PDF renderer boundary' in text
          assert 'Full-stack PDF import through isolated renderer' in text
          assert 'mangasensei-pdf-renderer-e2e' in text
          PY

      - name: Commit required CI integration
        run: |
          if git diff --quiet -- .github/workflows/ci.yml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git commit -m "ci(pdf): validate isolated full-stack import"
          git push origin HEAD:feat/105-hardened-pdf-import
