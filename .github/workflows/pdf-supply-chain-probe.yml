name: PDF supply-chain probe

on:
  push:
    branches: [feat/105-hardened-pdf-import]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: "3.11"
          prune-cache: true
      - name: Inspect selected wheel and bundled PDFium
        run: |
          uv sync --frozen
          uv run python - <<'PY'
          from importlib import metadata
          from pathlib import Path
          import pypdfium2_raw
          from pypdfium2.version import PDFIUM_INFO, PYPDFIUM_INFO

          print("PYPDFIUM2", PYPDFIUM_INFO.tag)
          print("PDFIUM", PDFIUM_INFO.tag, "BUILD", PDFIUM_INFO.build, "FLAGS", sorted(PDFIUM_INFO.flags))
          print("RAW", Path(pypdfium2_raw.__file__).resolve())
          for name in ("pypdfium2", "pypdfium2_raw"):
              try:
                  dist = metadata.distribution(name)
              except metadata.PackageNotFoundError:
                  print("DIST_MISSING", name)
                  continue
              print("DIST", name, dist.version, "LICENSE", dist.metadata.get("License"))
              for item in dist.files or ():
                  upper = str(item).upper()
                  if "LICENSE" in upper or "NOTICE" in upper:
                      path = Path(dist.locate_file(item))
                      print("NOTICE_FILE", name, item)
                      if path.is_file() and path.stat().st_size <= 2_000_000:
                          print(path.read_text(encoding="utf-8", errors="replace"))
          PY
          LIBPDFIUM="$(uv run python - <<'PY'
          from pathlib import Path
          import pypdfium2_raw
          print(Path(pypdfium2_raw.__file__).resolve().parent / 'libpdfium.so')
          PY
          )"
          echo "LDD ${LIBPDFIUM}"
          ldd "${LIBPDFIUM}"
