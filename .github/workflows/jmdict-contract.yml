name: JMdict Data Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/src/mangasensei/linguistics/jmdict.py"
      - "backend/src/mangasensei/linguistics/jmdict_bootstrap.py"
      - "backend/src/mangasensei/linguistics/jmdict_manifest.json"
      - "scripts/update_jmdict_manifest.py"
      - "tests/unit/test_jmdict_bootstrap.py"
      - ".github/workflows/jmdict-contract.yml"
  push:
    branches: [main]
    paths:
      - "backend/src/mangasensei/linguistics/jmdict.py"
      - "backend/src/mangasensei/linguistics/jmdict_bootstrap.py"
      - "backend/src/mangasensei/linguistics/jmdict_manifest.json"
      - "scripts/update_jmdict_manifest.py"
      - "tests/unit/test_jmdict_bootstrap.py"
      - ".github/workflows/jmdict-contract.yml"

permissions:
  contents: read

concurrency:
  group: jmdict-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Pinned source and normalized metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: "3.11"
          prune-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Verify pinned source and normalized metadata
        run: uv run python scripts/update_jmdict_manifest.py --check

      - name: Diagnose runtime-normalized form collisions
        run: |
          uv run python - <<'PY'
          import asyncio
          import hashlib
          import json

          import httpx

          from mangasensei.linguistics.jmdict_bootstrap import (
              JmdictManifest,
              build_normalized_jmdict,
              default_manifest_path,
          )

          def hiragana(value: str) -> str:
              return "".join(
                  chr(ord(character) - 0x60) if "ァ" <= character <= "ヶ" else character
                  for character in value
              )

          async def main() -> None:
              manifest = JmdictManifest.load(default_manifest_path())
              timeout = httpx.Timeout(300.0, connect=30.0)
              async with httpx.AsyncClient(timeout=timeout) as client:
                  normalized = await build_normalized_jmdict(manifest, client)

              digest = hashlib.sha256(normalized).hexdigest()
              print(
                  "normalized_metadata="
                  + json.dumps(
                      {
                          "sha256": digest,
                          "size_bytes": len(normalized),
                          "expected_sha256": manifest.normalized.sha256,
                          "expected_size_bytes": manifest.normalized.size_bytes,
                      },
                      sort_keys=True,
                  )
              )
              if digest != manifest.normalized.sha256 or len(normalized) != manifest.normalized.size_bytes:
                  raise SystemExit("normalized bytes do not match the reviewed manifest")

              payload = json.loads(normalized.decode("utf-8"))
              collisions: list[dict[str, object]] = []
              differing_meanings = 0
              for entry in payload["entries"]:
                  seen: dict[tuple[str, str], dict[str, object]] = {}
                  for form in entry["forms"]:
                      raw_lemma = str(form["lemma"]).strip()
                      raw_reading = str(form["reading"]).strip()
                      reading = hiragana(raw_reading)
                      lemma = hiragana(raw_lemma) if raw_lemma == raw_reading else raw_lemma
                      key = (lemma, reading)
                      previous = seen.get(key)
                      if previous is not None:
                          same_meanings = previous.get("meanings") == form.get("meanings")
                          if not same_meanings:
                              differing_meanings += 1
                          collisions.append(
                              {
                                  "entry_id": entry["id"],
                                  "normalized_key": list(key),
                                  "first_form": previous,
                                  "second_form": form,
                                  "same_meanings": same_meanings,
                              }
                          )
                      else:
                          seen[key] = form

              print(
                  "normalized_collision_summary="
                  + json.dumps(
                      {
                          "collision_count": len(collisions),
                          "entries_with_collisions": len({str(item["entry_id"]) for item in collisions}),
                          "differing_meanings_count": differing_meanings,
                      },
                      sort_keys=True,
                  )
              )
              for collision in collisions[:25]:
                  print(
                      "normalized_form_collision="
                      + json.dumps(collision, ensure_ascii=False, sort_keys=True)
                  )
              if collisions:
                  raise SystemExit(2)
              print("normalized_form_collision=none")

          asyncio.run(main())
          PY
