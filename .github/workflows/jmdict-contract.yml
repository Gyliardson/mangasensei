name: JMdict Data Contract

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "backend/migrations/versions/*dictionary_projections.py"
      - "backend/src/mangasensei/api/app.py"
      - "backend/src/mangasensei/application/page_queries.py"
      - "backend/src/mangasensei/application/reprocessing.py"
      - "backend/src/mangasensei/cli.py"
      - "backend/src/mangasensei/infrastructure/database/dictionary_projection_models.py"
      - "backend/src/mangasensei/linguistics/jmdict.py"
      - "backend/src/mangasensei/linguistics/jmdict_bootstrap.py"
      - "backend/src/mangasensei/linguistics/jmdict_glosses.py"
      - "backend/src/mangasensei/linguistics/jmdict_packs.py"
      - "backend/src/mangasensei/linguistics/runtime_glosses.py"
      - "backend/src/mangasensei/linguistics/jmdict_manifest*.json"
      - "backend/src/mangasensei/linguistics/jmdict_packs.json"
      - "backend/src/mangasensei/runtime.py"
      - "backend/src/mangasensei/workers/dictionary_projection.py"
      - "scripts/update_jmdict_manifest.py"
      - "scripts/measure_jmdict_load.py"
      - "tests/integration/test_dictionary_projection_*.py"
      - "tests/unit/test_jmdict_bootstrap.py"
      - "tests/unit/test_jmdict_glosses.py"
      - "tests/unit/test_jmdict_packs.py"
      - "tests/unit/test_runtime_glosses.py"
      - "tests/unit/test_cli.py"
      - "tests/fullstack/fixtures/jmdict.json"
      - "THIRD_PARTY_NOTICES.md"
      - "docs/jmdict-packs.md"
      - "docs/jmdict-pack-measurement.md"
      - "docs/versions.md"
      - "pyproject.toml"
      - ".env.example"
      - "compose.yaml"
      - "Dockerfile"
      - ".github/workflows/jmdict-contract.yml"
  push:
    branches: [main]
    paths:
      - "backend/migrations/versions/*dictionary_projections.py"
      - "backend/src/mangasensei/api/app.py"
      - "backend/src/mangasensei/application/page_queries.py"
      - "backend/src/mangasensei/application/reprocessing.py"
      - "backend/src/mangasensei/cli.py"
      - "backend/src/mangasensei/infrastructure/database/dictionary_projection_models.py"
      - "backend/src/mangasensei/linguistics/jmdict.py"
      - "backend/src/mangasensei/linguistics/jmdict_bootstrap.py"
      - "backend/src/mangasensei/linguistics/jmdict_glosses.py"
      - "backend/src/mangasensei/linguistics/jmdict_packs.py"
      - "backend/src/mangasensei/linguistics/runtime_glosses.py"
      - "backend/src/mangasensei/linguistics/jmdict_manifest*.json"
      - "backend/src/mangasensei/linguistics/jmdict_packs.json"
      - "backend/src/mangasensei/runtime.py"
      - "backend/src/mangasensei/workers/dictionary_projection.py"
      - "scripts/update_jmdict_manifest.py"
      - "scripts/measure_jmdict_load.py"
      - "tests/integration/test_dictionary_projection_*.py"
      - "tests/unit/test_jmdict_bootstrap.py"
      - "tests/unit/test_jmdict_glosses.py"
      - "tests/unit/test_jmdict_packs.py"
      - "tests/unit/test_runtime_glosses.py"
      - "tests/unit/test_cli.py"
      - "tests/fullstack/fixtures/jmdict.json"
      - "THIRD_PARTY_NOTICES.md"
      - "docs/jmdict-packs.md"
      - "docs/jmdict-pack-measurement.md"
      - "docs/versions.md"
      - "pyproject.toml"
      - ".env.example"
      - "compose.yaml"
      - "Dockerfile"
      - ".github/workflows/jmdict-contract.yml"

permissions:
  contents: read

concurrency:
  group: jmdict-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Pinned packs through runtime loader
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: "3.11"
          prune-cache: true

      - name: Configure reviewed dictionary path
        run: echo "MANGASENSEI_JMDICT_PATH=${RUNNER_TEMP}/mangasensei-jmdict/jmdict.json" >> "${GITHUB_ENV}"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Verify all reviewed sources, normalized metadata and runtime loads
        run: uv run python scripts/update_jmdict_manifest.py --check

      - name: Validate focused producer, resolver, lazy provider, pack and CLI regressions
        run: |
          uv run pytest \
            tests/unit/test_jmdict_bootstrap.py \
            tests/unit/test_jmdict_glosses.py \
            tests/unit/test_jmdict_packs.py \
            tests/unit/test_runtime_glosses.py \
            tests/unit/test_cli.py \
            -q

      - name: Exercise backward-compatible English and explicit German bootstrap
        run: |
          uv run mangasensei jmdict download
          uv run mangasensei jmdict verify
          uv run mangasensei jmdict download --language de
          uv run mangasensei jmdict verify --language de

      - name: Record one-process pack load measurements
        run: |
          uv run python scripts/measure_jmdict_load.py "${MANGASENSEI_JMDICT_PATH}"
          uv run python scripts/measure_jmdict_load.py "$(dirname "${MANGASENSEI_JMDICT_PATH}")/jmdict-de.json"

  docker-bootstrap:
    name: Fresh Compose prerequisites, API, worker and first-analysis readiness
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MANGASENSEI_VERSION: jmdict-contract
      MANGASENSEI_PORT: "18000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create fresh Quick Start environment
        run: |
          test ! -e .env
          cp .env.example .env
          python - <<'PY'
          from pathlib import Path
          import secrets

          path = Path(".env")
          text = path.read_text(encoding="utf-8")
          database_password = secrets.token_urlsafe(32)
          capability_pepper = secrets.token_urlsafe(32)
          text = text.replace(
              "POSTGRES_PASSWORD=replace-with-a-long-random-password",
              f"POSTGRES_PASSWORD={database_password}",
          )
          text = text.replace(
              "postgresql+psycopg://mangasensei:replace-with-a-long-random-password@localhost:5432/mangasensei",
              f"postgresql+psycopg://mangasensei:{database_password}@localhost:5432/mangasensei",
          )
          text = text.replace(
              'MANGASENSEI_CAPABILITY_PEPPERS=["replace-with-a-long-random-pepper"]',
              f'MANGASENSEI_CAPABILITY_PEPPERS=["{capability_pepper}"]',
          )
          assert "replace-with-a-long-random-password" not in text
          assert "replace-with-a-long-random-pepper" not in text
          assert "GOOGLE_API_KEY=\n" in text
          path.write_text(text, encoding="utf-8")
          PY
          git check-ignore --quiet .env
          git diff --exit-code

      - name: Ensure clean named volumes
        run: docker compose down --volumes --remove-orphans

      - name: Start production Compose stack from clean volumes
        run: docker compose up --detach --build

      - name: Require one-shot prerequisite success, API readiness and worker health
        run: |
          require_completed_successfully() {
            service="$1"
            container_id="$(docker compose ps --all --quiet "${service}")"
            test -n "${container_id}"
            for attempt in $(seq 1 120); do
              status="$(docker inspect "${container_id}" --format '{{.State.Status}}')"
              if test "${status}" = "exited"; then
                exit_code="$(docker inspect "${container_id}" --format '{{.State.ExitCode}}')"
                if test "${exit_code}" = "0"; then
                  return 0
                fi
                docker compose logs "${service}"
                return 1
              fi
              if test "${status}" = "dead"; then
                docker compose logs "${service}"
                return 1
              fi
              sleep 2
            done
            docker compose logs "${service}"
            return 1
          }

          require_completed_successfully models
          require_completed_successfully jmdict
          require_completed_successfully migrate
          docker compose run --rm --no-deps jmdict mangasensei jmdict verify
          docker compose run --rm --no-deps jmdict mangasensei jmdict verify --language de

          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error "http://127.0.0.1:${MANGASENSEI_PORT}/ready" >/dev/null; then
              break
            fi
            if test "${attempt}" = "120"; then
              docker compose logs api migrate
              exit 1
            fi
            sleep 2
          done

          worker_id="$(docker compose ps --all --quiet worker)"
          test -n "${worker_id}"
          for attempt in $(seq 1 120); do
            health="$(docker inspect "${worker_id}" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}')"
            if test "${health}" = "healthy"; then
              exit 0
            fi
            if test "$(docker inspect "${worker_id}" --format '{{.State.Running}}')" != "true"; then
              docker compose logs models jmdict migrate api worker
              exit 1
            fi
            sleep 2
          done
          docker compose logs models jmdict migrate api worker
          exit 1

      - name: Complete one local-only analysis through production Compose
        run: |
          image_path="${RUNNER_TEMP}/mangasensei-quickstart.png"
          upload_path="${RUNNER_TEMP}/mangasensei-quickstart-upload.json"
          access_path="${RUNNER_TEMP}/mangasensei-quickstart-access.txt"
          status_path="${RUNNER_TEMP}/mangasensei-quickstart-status.json"
          roundtrip_path="${RUNNER_TEMP}/mangasensei-quickstart-roundtrip.png"

          docker compose run --rm --no-deps -T jmdict python -c 'from PIL import Image, ImageDraw; import sys; image=Image.new("RGB", (800, 1200), "white"); draw=ImageDraw.Draw(image); draw.rectangle((40, 40, 760, 560), outline="black", width=12); draw.ellipse((160, 180, 640, 420), outline="black", width=8); draw.rectangle((40, 620, 760, 1160), outline="black", width=12); image.save(sys.stdout.buffer, format="PNG")' > "${image_path}"

          curl --fail --silent --show-error \
            -H "Idempotency-Key: quickstart-compose-smoke-0001" \
            -F "image=@${image_path};type=image/png" \
            -F "studyLanguage=pt-BR" \
            "http://127.0.0.1:${MANGASENSEI_PORT}/api/v1/pages" \
            > "${upload_path}"

          UPLOAD_PATH="${upload_path}" ACCESS_PATH="${access_path}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["UPLOAD_PATH"]).read_text(encoding="utf-8"))
          data = payload["data"]
          assert payload["success"] is True
          assert data["studyLanguage"] == "pt-BR"
          Path(os.environ["ACCESS_PATH"]).write_text(
              "\n".join(
                  [
                      data["pageId"],
                      data["capabilities"]["readPage"],
                      data["capabilities"]["readImage"],
                  ]
              )
              + "\n",
              encoding="utf-8",
          )
          PY

          mapfile -t access < "${access_path}"
          page_id="${access[0]}"
          read_page_token="${access[1]}"
          read_image_token="${access[2]}"

          completed=false
          for attempt in $(seq 1 180); do
            curl --fail --silent --show-error \
              -H "X-Page-Token: ${read_page_token}" \
              "http://127.0.0.1:${MANGASENSEI_PORT}/api/v1/pages/${page_id}/status" \
              > "${status_path}"
            read -r page_status result_available < <(
              STATUS_PATH="${status_path}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path(os.environ["STATUS_PATH"]).read_text(encoding="utf-8"))["data"]
          print(data["status"], str(data["resultAvailable"]).lower())
          PY
            )
            if test "${page_status}" = "completed" && test "${result_available}" = "true"; then
              completed=true
              break
            fi
            sleep 2
          done

          if test "${completed}" != "true"; then
            cat "${status_path}"
            docker compose logs worker api
            exit 1
          fi

          curl --fail --silent --show-error \
            -H "X-Page-Token: ${read_image_token}" \
            "http://127.0.0.1:${MANGASENSEI_PORT}/api/v1/pages/${page_id}/image" \
            > "${roundtrip_path}"
          cmp "${image_path}" "${roundtrip_path}"

      - name: Show bootstrap status on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs models jmdict migrate api worker

      - name: Remove test stack and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
