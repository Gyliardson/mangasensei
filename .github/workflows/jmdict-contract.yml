name: JMdict Data Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/src/mangasensei/linguistics/jmdict.py"
      - "backend/src/mangasensei/linguistics/jmdict_bootstrap.py"
      - "backend/src/mangasensei/linguistics/jmdict_manifest.json"
      - "scripts/update_jmdict_manifest.py"
      - "tests/unit/test_jmdict_bootstrap.py"
      - "compose.yaml"
      - "Dockerfile"
      - ".github/workflows/jmdict-contract.yml"
  push:
    branches: [main]
    paths:
      - "backend/src/mangasensei/linguistics/jmdict.py"
      - "backend/src/mangasensei/linguistics/jmdict_bootstrap.py"
      - "backend/src/mangasensei/linguistics/jmdict_manifest.json"
      - "scripts/update_jmdict_manifest.py"
      - "tests/unit/test_jmdict_bootstrap.py"
      - "compose.yaml"
      - "Dockerfile"
      - ".github/workflows/jmdict-contract.yml"

permissions:
  contents: read

concurrency:
  group: jmdict-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Pinned source through runtime loader
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: "3.11"
          prune-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Verify pinned source, normalized metadata and runtime load
        run: uv run python scripts/update_jmdict_manifest.py --check

      - name: Validate focused producer and consumer regressions
        run: uv run pytest tests/unit/test_jmdict_bootstrap.py -q

  docker-bootstrap:
    name: Fresh Compose prerequisites and worker readiness
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: jmdict-contract-database-password
      MANGASENSEI_CAPABILITY_PEPPERS: '["jmdict-contract-capability-pepper-000000000001"]'
      MANGASENSEI_VERSION: jmdict-contract
      MANGASENSEI_PORT: "18000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure clean named volumes
        run: docker compose down --volumes --remove-orphans

      - name: Start production Compose stack from clean volumes
        run: docker compose up --detach --build

      - name: Require JMdict bootstrap success and worker health
        run: |
          jmdict_id="$(docker compose ps --all --quiet jmdict)"
          test -n "${jmdict_id}"
          test "$(docker inspect "${jmdict_id}" --format '{{.State.ExitCode}}')" = "0"

          worker_id="$(docker compose ps --all --quiet worker)"
          test -n "${worker_id}"
          for attempt in $(seq 1 120); do
            health="$(docker inspect "${worker_id}" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}')"
            if test "${health}" = "healthy"; then
              exit 0
            fi
            if test "$(docker inspect "${worker_id}" --format '{{.State.Running}}')" != "true"; then
              docker compose logs jmdict worker
              exit 1
            fi
            sleep 2
          done
          docker compose logs jmdict worker
          exit 1

      - name: Show prerequisite and worker status on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs jmdict worker

      - name: Remove test stack and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
