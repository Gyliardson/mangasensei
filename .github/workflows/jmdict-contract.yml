name: JMdict Data Contract

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "backend/migrations/versions/*dictionary_projections.py"
      - "backend/src/mangasensei/api/app.py"
      - "backend/src/mangasensei/application/page_queries.py"
      - "backend/src/mangasensei/application/reprocessing.py"
      - "backend/src/mangasensei/cli.py"
      - "backend/src/mangasensei/infrastructure/database/dictionary_projection_models.py"
      - "backend/src/mangasensei/linguistics/jmdict.py"
      - "backend/src/mangasensei/linguistics/jmdict_bootstrap.py"
      - "backend/src/mangasensei/linguistics/jmdict_glosses.py"
      - "backend/src/mangasensei/linguistics/jmdict_packs.py"
      - "backend/src/mangasensei/linguistics/runtime_glosses.py"
      - "backend/src/mangasensei/linguistics/jmdict_manifest*.json"
      - "backend/src/mangasensei/linguistics/jmdict_packs.json"
      - "backend/src/mangasensei/runtime.py"
      - "backend/src/mangasensei/workers/dictionary_projection.py"
      - "scripts/update_jmdict_manifest.py"
      - "scripts/measure_jmdict_load.py"
      - "tests/integration/test_dictionary_projection_*.py"
      - "tests/unit/test_jmdict_bootstrap.py"
      - "tests/unit/test_jmdict_glosses.py"
      - "tests/unit/test_jmdict_packs.py"
      - "tests/unit/test_runtime_glosses.py"
      - "tests/unit/test_cli.py"
      - "tests/fullstack/fixtures/jmdict.json"
      - "THIRD_PARTY_NOTICES.md"
      - "docs/jmdict-packs.md"
      - "docs/jmdict-pack-measurement.md"
      - "docs/versions.md"
      - "pyproject.toml"
      - "compose.yaml"
      - "Dockerfile"
      - ".github/workflows/jmdict-contract.yml"
  push:
    branches: [main]
    paths:
      - "backend/migrations/versions/*dictionary_projections.py"
      - "backend/src/mangasensei/api/app.py"
      - "backend/src/mangasensei/application/page_queries.py"
      - "backend/src/mangasensei/application/reprocessing.py"
      - "backend/src/mangasensei/cli.py"
      - "backend/src/mangasensei/infrastructure/database/dictionary_projection_models.py"
      - "backend/src/mangasensei/linguistics/jmdict.py"
      - "backend/src/mangasensei/linguistics/jmdict_bootstrap.py"
      - "backend/src/mangasensei/linguistics/jmdict_glosses.py"
      - "backend/src/mangasensei/linguistics/jmdict_packs.py"
      - "backend/src/mangasensei/linguistics/runtime_glosses.py"
      - "backend/src/mangasensei/linguistics/jmdict_manifest*.json"
      - "backend/src/mangasensei/linguistics/jmdict_packs.json"
      - "backend/src/mangasensei/runtime.py"
      - "backend/src/mangasensei/workers/dictionary_projection.py"
      - "scripts/update_jmdict_manifest.py"
      - "scripts/measure_jmdict_load.py"
      - "tests/integration/test_dictionary_projection_*.py"
      - "tests/unit/test_jmdict_bootstrap.py"
      - "tests/unit/test_jmdict_glosses.py"
      - "tests/unit/test_jmdict_packs.py"
      - "tests/unit/test_runtime_glosses.py"
      - "tests/unit/test_cli.py"
      - "tests/fullstack/fixtures/jmdict.json"
      - "THIRD_PARTY_NOTICES.md"
      - "docs/jmdict-packs.md"
      - "docs/jmdict-pack-measurement.md"
      - "docs/versions.md"
      - "pyproject.toml"
      - "compose.yaml"
      - "Dockerfile"
      - ".github/workflows/jmdict-contract.yml"

permissions:
  contents: read

concurrency:
  group: jmdict-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Pinned packs through runtime loader
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: "3.11"
          prune-cache: true

      - name: Configure reviewed dictionary path
        run: echo "MANGASENSEI_JMDICT_PATH=${RUNNER_TEMP}/mangasensei-jmdict/jmdict.json" >> "${GITHUB_ENV}"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Verify all reviewed sources, normalized metadata and runtime loads
        run: uv run python scripts/update_jmdict_manifest.py --check

      - name: Validate focused producer, resolver, lazy provider, pack and CLI regressions
        run: |
          uv run pytest \
            tests/unit/test_jmdict_bootstrap.py \
            tests/unit/test_jmdict_glosses.py \
            tests/unit/test_jmdict_packs.py \
            tests/unit/test_runtime_glosses.py \
            tests/unit/test_cli.py \
            -q

      - name: Exercise backward-compatible English and explicit German bootstrap
        run: |
          uv run mangasensei jmdict download
          uv run mangasensei jmdict verify
          uv run mangasensei jmdict download --language de
          uv run mangasensei jmdict verify --language de

      - name: Record one-process pack load measurements
        run: |
          uv run python scripts/measure_jmdict_load.py "${MANGASENSEI_JMDICT_PATH}"
          uv run python scripts/measure_jmdict_load.py "$(dirname "${MANGASENSEI_JMDICT_PATH}")/jmdict-de.json"

  docker-bootstrap:
    name: Fresh Compose prerequisites, API and worker readiness
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: jmdict-contract-database-password
      MANGASENSEI_CAPABILITY_PEPPERS: '["jmdict-contract-capability-pepper-000000000001"]'
      MANGASENSEI_VERSION: jmdict-contract
      MANGASENSEI_PORT: "18000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure clean named volumes
        run: docker compose down --volumes --remove-orphans

      - name: Start production Compose stack from clean volumes
        run: docker compose up --detach --build

      - name: Require one-shot prerequisite success, API readiness and worker health
        run: |
          require_completed_successfully() {
            service="$1"
            container_id="$(docker compose ps --all --quiet "${service}")"
            test -n "${container_id}"
            for attempt in $(seq 1 120); do
              status="$(docker inspect "${container_id}" --format '{{.State.Status}}')"
              if test "${status}" = "exited"; then
                exit_code="$(docker inspect "${container_id}" --format '{{.State.ExitCode}}')"
                if test "${exit_code}" = "0"; then
                  return 0
                fi
                docker compose logs "${service}"
                return 1
              fi
              if test "${status}" = "dead"; then
                docker compose logs "${service}"
                return 1
              fi
              sleep 2
            done
            docker compose logs "${service}"
            return 1
          }

          require_completed_successfully models
          require_completed_successfully jmdict
          require_completed_successfully migrate
          docker compose run --rm --no-deps jmdict mangasensei jmdict verify
          docker compose run --rm --no-deps jmdict mangasensei jmdict verify --language de

          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error "http://127.0.0.1:${MANGASENSEI_PORT}/ready" >/dev/null; then
              break
            fi
            if test "${attempt}" = "120"; then
              docker compose logs api migrate
              exit 1
            fi
            sleep 2
          done

          worker_id="$(docker compose ps --all --quiet worker)"
          test -n "${worker_id}"
          for attempt in $(seq 1 120); do
            health="$(docker inspect "${worker_id}" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}')"
            if test "${health}" = "healthy"; then
              exit 0
            fi
            if test "$(docker inspect "${worker_id}" --format '{{.State.Running}}')" != "true"; then
              docker compose logs models jmdict migrate api worker
              exit 1
            fi
            sleep 2
          done
          docker compose logs models jmdict migrate api worker
          exit 1

      - name: Show bootstrap status on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs models jmdict migrate api worker

      - name: Remove test stack and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
