name: OCR 54 Linguistic Tie-break Audit

on:
  push:
    branches: [investigate/54-ocr-ensemble-benchmark]
    paths:
      - ".github/workflows/ocr-54-linguistic-tiebreak.yml"
      - "scripts/ocr_54_linguistic_tiebreak_audit.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: "3.11"
          prune-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check scripts/ocr_54_linguistic_tiebreak_audit.py
      - name: Evaluate conservative Sudachi tie-break signals
        run: >-
          uv run python scripts/ocr_54_linguistic_tiebreak_audit.py
          --output var/ocr-54-linguistic-tiebreak
      - name: Upload linguistic audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocr-54-linguistic-tiebreak
          path: var/ocr-54-linguistic-tiebreak
          if-no-files-found: error
          retention-days: 7
