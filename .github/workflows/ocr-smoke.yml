name: OCR Smoke

on:
  workflow_call:
    inputs:
      repeat_runs:
        description: Number of identical runs for reviewed short-text fixtures
        required: false
        type: number
        default: 1
      full_corpus:
        description: Run the broader licensed corpus catastrophic-output guard
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      repeat_runs:
        description: Number of identical runs for reviewed short-text fixtures
        required: false
        type: number
        default: 3
      full_corpus:
        description: Run the broader licensed corpus catastrophic-output guard
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "17 5 * * 1"
  pull_request:
    paths:
      - "backend/src/mangasensei/ocr/**"
      - "tests/test_ocr_smoke.py"
      - "tests/test_ocr_real_manga.py"
      - "tests/test_ocr_real_manga_precision.py"
      - "tests/unit/test_ocr_opencv_ab.py"
      - "tests/unit/test_ocr_opencv_array_groups.py"
      - "tests/unit/test_ocr_opencv_model_evidence.py"
      - "tests/unit/test_ocr_opencv_reviewed_maps.py"
      - "tests/unit/test_ocr_opencv_semantic_gates.py"
      - "tests/fixtures/ocr/real_manga/**"
      - "scripts/ocr_opencv_ab.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ocr-smoke.yml"
  push:
    branches: [main]
    paths:
      - "backend/src/mangasensei/ocr/**"
      - "tests/test_ocr_smoke.py"
      - "tests/test_ocr_real_manga.py"
      - "tests/test_ocr_real_manga_precision.py"
      - "tests/unit/test_ocr_opencv_ab.py"
      - "tests/unit/test_ocr_opencv_array_groups.py"
      - "tests/unit/test_ocr_opencv_model_evidence.py"
      - "tests/unit/test_ocr_opencv_reviewed_maps.py"
      - "tests/unit/test_ocr_opencv_semantic_gates.py"
      - "tests/fixtures/ocr/real_manga/**"
      - "scripts/ocr_opencv_ab.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ocr-smoke.yml"

permissions:
  contents: read

concurrency:
  group: ocr-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Real OCR models (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MANGASENSEI_MODEL_CACHE: ${{ github.workspace }}/var/models
      MANGASENSEI_RUN_OCR_SMOKE: "1"
      MANGASENSEI_OCR_ARTIFACT_DIR: ${{ github.workspace }}/var/ocr-visual-audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select OCR assurance depth
        env:
          REQUESTED_REPEAT_RUNS: ${{ inputs.repeat_runs }}
          REQUESTED_FULL_CORPUS: ${{ inputs.full_corpus }}
        run: |
          repeat_runs=1
          full_corpus=0
          case "${GITHUB_EVENT_NAME}" in
            schedule)
              repeat_runs=3
              full_corpus=1
              ;;
            workflow_dispatch|workflow_call)
              repeat_runs="${REQUESTED_REPEAT_RUNS:-1}"
              if [ "${REQUESTED_FULL_CORPUS:-false}" = "true" ]; then
                full_corpus=1
              fi
              ;;
          esac
          if ! [[ "${repeat_runs}" =~ ^[1-5]$ ]]; then
            echo "repeat_runs must be an integer from 1 through 5" >&2
            exit 1
          fi
          echo "MANGASENSEI_OCR_REPEAT_RUNS=${repeat_runs}" >> "${GITHUB_ENV}"
          echo "MANGASENSEI_OCR_FULL_CORPUS=${full_corpus}" >> "${GITHUB_ENV}"
          echo "OCR assurance depth: repeat_runs=${repeat_runs}, full_corpus=${full_corpus}"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: "3.11"
          prune-cache: true

      - name: Install locked OCR dependencies
        run: uv sync --frozen --extra ocr

      - name: Download reviewed OCR models
        run: uv run mangasensei models download

      - name: Verify reviewed OCR models
        run: uv run mangasensei models verify

      - name: Run synthetic and licensed real-manga OCR smoke
        run: >-
          uv run pytest tests/test_ocr_smoke.py tests/test_ocr_real_manga.py
          tests/test_ocr_real_manga_precision.py -m ocr_smoke -vv -s --maxfail=1

      - name: Upload boxed OCR visual audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocr-visual-audit
          path: var/ocr-visual-audit
          if-no-files-found: warn
          retention-days: 7
