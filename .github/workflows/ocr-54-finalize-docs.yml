name: OCR 54 Finalize Docs

on:
  pull_request:
    paths:
      - ".github/workflows/ocr-54-finalize-docs.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Synchronize OCR assurance documentation
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("tests/fixtures/ocr/real_manga/black_jack/README.md"): [
                  (
                      "- **PR / `main` OCR gate:** pages 73 and 90 protect reviewed short vertical text targets (`うむ` and the `はい` core of `はい‼`) using broad target areas and region-count bounds.\n",
                      "- **PR / `main` OCR gate:** page 9 protects a reviewed two-line vertical target against recognizer batch-composition loss, while pages 73 and 90 protect the known-good short vertical targets (`うむ` and the `はい` core of `はい‼`). Assertions use broad reviewed geometry and loose region-count bounds rather than pixel snapshots.\n",
                  ),
                  (
                      "- **Scheduled / release / deep manual gate:** the same two reviewed targets run three identical CPU passes to detect unexpected present/absent instability. The remaining manifest pages are also processed once with a broad catastrophic region-count guard; these pages do not claim transcript-level ground truth.\n",
                      "- **Scheduled / release / deep manual gate:** all three reviewed targets run three identical CPU passes to detect unexpected present/absent instability. The remaining manifest pages are also processed once with a broad catastrophic region-count guard; these pages do not claim transcript-level ground truth.\n",
                  ),
              ],
              Path("docs/testing.md"): [
                  (
                      "- **OCR-related pull requests and `main`:** pages 73 and 90 run once using the exact production configuration. `tests/test_ocr_real_manga.py` requires the known-good short vertical target (`うむ` on page 73 and the `はい` core of `はい‼` on page 90) to survive detector → recognizer → merge → adapter inside its broad reviewed page area, with a `4..32` region-count guard.\n",
                      "- **OCR-related pull requests and `main`:** page 9, page 73 and page 90 run once using the exact production configuration. Page 9 requires both reviewed detector lines to survive when they form the complete narrow recognizer batch and to merge into broad reviewed two-column geometry; pages 73 and 90 retain the known-good short vertical targets (`うむ` and the `はい` core of `はい‼`). Full-page assertions remain limited to broad geometry and loose `4..32` region-count bounds.\n",
                  ),
                  (
                      "- **Weekly schedule, tagged release and deep manual run:** the two reviewed targets run three identical CPU passes. Every pass must preserve the target, reviewed broad geometry and region-count guard. The other nine manifest pages run once with only a broad `2..32` catastrophic region-count contract; they intentionally do not claim transcript-level or semantic ground truth.\n",
                      "- **Weekly schedule, tagged release and deep manual run:** all three reviewed targets run three identical CPU passes. Every pass must preserve the target, reviewed broad geometry and region-count guard. The other nine manifest pages run once with only a broad `2..32` catastrophic region-count contract; they intentionally do not claim transcript-level or semantic ground truth.\n",
                  ),
                  (
                      "These short-text cases were first characterized during #54 investigation with the production detector and recognizer thresholds; both already succeeded at the production `minimum_confidence=0.2`, so they are positive regressions rather than evidence that lowering OCR thresholds would fix the user-reported missing `でも` case. Repeatability checks characterize the current CPU boundary; they do not claim that PyTorch/OpenCV are universally deterministic or that the original `でも` failure has been reproduced.\n",
                      "Pages 73 and 90 were first characterized during #54 investigation and already succeeded at production `minimum_confidence=0.2`, so they remain positive regressions rather than evidence for lowering OCR thresholds. Page 9 adds a different reviewed regression: the same detector crop could fall below `0.2` solely when it became the widest crop in a narrow recognizer batch because the batch tensor exposed fewer ConvNeXt features than the decoder mask declared valid. Repeatability checks characterize the current CPU boundary; they do not claim that PyTorch/OpenCV are universally deterministic or that the historical `でも` failure has been reproduced.\n",
                  ),
                  (
                      "- pull requests and `main` changes that touch the OCR implementation/model files, either OCR smoke test, the licensed real-manga fixture corpus, `pyproject.toml`, `uv.lock`, or the smoke workflow itself use the small reviewed two-page gate;\n",
                      "- pull requests and `main` changes that touch the OCR implementation/model files, either OCR smoke test, the licensed real-manga fixture corpus, `pyproject.toml`, `uv.lock`, or the smoke workflow itself use the small reviewed three-page gate;\n",
                  ),
                  (
                      "- once per week from the default branch, with three repeats of the reviewed short-text cases plus the wider licensed corpus guard;\n",
                      "- once per week from the default branch, with three repeats of the reviewed real-manga targets plus the wider licensed corpus guard;\n",
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"expected documentation text not found in {path}: {old!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          anchor = "### Fixed\n\n"
          entry = (
              "- The 48px OCR recognizer now pads each batch far enough for the decoder's "
              "declared valid ConvNeXt features, preventing a real page-9 text line from "
              "falling below confidence solely because it is the widest crop in its batch.\n"
          )
          if entry not in text:
              if anchor not in text:
                  raise SystemExit("changelog Fixed section not found")
              text = text.replace(anchor, anchor + entry, 1)
              changelog.write_text(text, encoding="utf-8")
          PY

          if git diff --quiet; then
            echo "documentation already synchronized"
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md docs/testing.md tests/fixtures/ocr/real_manga/black_jack/README.md
          git commit -m "docs(ocr): document page 9 batch regression"
          git push origin "HEAD:${HEAD_BRANCH}"
