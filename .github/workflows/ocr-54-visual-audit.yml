name: OCR 54 Exact Head Deep Validation

on:
  push:
    branches: [investigate/54-page9-overlay3]
    paths:
      - ".github/workflows/ocr-54-visual-audit.yml"

permissions:
  contents: read

concurrency:
  group: ocr-54-exact-head-deep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Exact PR head deep OCR and visual audit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_SHA: 258ca0dda056a9d3243a6f74e3b55254a9eda65c
      MANGASENSEI_MODEL_CACHE: ${{ github.workspace }}/var/models
      MANGASENSEI_RUN_OCR_SMOKE: "1"
      MANGASENSEI_OCR_REPEAT_RUNS: "3"
      MANGASENSEI_OCR_FULL_CORPUS: "1"
      MANGASENSEI_OCR_ARTIFACT_DIR: ${{ github.workspace }}/var/ocr-visual-audit
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 258ca0dda056a9d3243a6f74e3b55254a9eda65c

      - name: Assert exact implementation SHA
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: "3.11"
          prune-cache: true

      - name: Install locked OCR dependencies
        run: uv sync --frozen --extra ocr

      - name: Download reviewed OCR models
        run: uv run mangasensei models download

      - name: Verify reviewed OCR models
        run: uv run mangasensei models verify

      - name: Run deep real OCR assurance
        run: uv run pytest tests/test_ocr_smoke.py tests/test_ocr_real_manga.py -m ocr_smoke -vv -s --maxfail=1

      - name: Upload exact-head visual audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocr-54-exact-head-visual-audit
          path: var/ocr-visual-audit
          if-no-files-found: error
          retention-days: 7
