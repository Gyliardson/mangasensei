name: OCR 54 Paddle v5 Compare

on:
  push:
    branches: [investigate/54-ocr-ensemble-benchmark]
    paths:
      - ".github/workflows/ocr-54-paddle-v5-compare.yml"
      - "scripts/ocr_54_prepare_paddle_scale_sweep.py"
      - "scripts/ocr_54_run_paddle_corpus_audit.py"
      - "scripts/ocr_54_summarize_paddle_scale_sweep.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MANGASENSEI_MODEL_CACHE: ${{ github.workspace }}/var/models
      HF_HOME: ${{ github.workspace }}/var/hf-paddle-v5
      XDG_CACHE_HOME: ${{ github.workspace }}/var/cache-paddle-v5
      HF_HUB_DISABLE_TELEMETRY: "1"
      TRANSFORMERS_VERBOSITY: error
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: "3.11"
          prune-cache: true
      - run: uv sync --frozen --extra ocr
      - name: Lint model-comparison scripts
        run: >-
          uv run ruff check
          scripts/ocr_54_prepare_paddle_scale_sweep.py
          scripts/ocr_54_run_paddle_corpus_audit.py
          scripts/ocr_54_summarize_paddle_scale_sweep.py
      - run: uv run mangasensei models download
      - run: uv run mangasensei models verify
      - name: Prepare reviewed crop variants
        run: >-
          uv run python scripts/ocr_54_prepare_paddle_scale_sweep.py
          --output var/ocr-54-paddle-v5/prepared
          --model-cache "$MANGASENSEI_MODEL_CACHE"
      - run: uv venv .bench-paddle-v5 --python 3.11
      - name: Install pinned PaddleOCR benchmark environment
        run: >-
          uv pip install --python .bench-paddle-v5/bin/python
          "paddleocr==3.7.0" "transformers==5.14.1"
      - name: Install project-matched CPU Torch
        run: >-
          uv pip install --python .bench-paddle-v5/bin/python
          --index https://download.pytorch.org/whl/cpu
          "torch==2.13.0" "torchvision==0.28.0"
      - name: Run PP-OCRv5 mobile over all crop variants
        run: >-
          .bench-paddle-v5/bin/python scripts/ocr_54_run_paddle_corpus_audit.py
          --model-name PP-OCRv5_mobile_rec
          --input var/ocr-54-paddle-v5/prepared
          --output var/ocr-54-paddle-v5/mobile
      - name: Run PP-OCRv5 server over all crop variants
        run: >-
          .bench-paddle-v5/bin/python scripts/ocr_54_run_paddle_corpus_audit.py
          --model-name PP-OCRv5_server_rec
          --input var/ocr-54-paddle-v5/prepared
          --output var/ocr-54-paddle-v5/server
      - name: Summarize PP-OCRv5 mobile
        run: >-
          python scripts/ocr_54_summarize_paddle_scale_sweep.py
          --prepared var/ocr-54-paddle-v5/prepared
          --paddle var/ocr-54-paddle-v5/mobile/paddle-corpus.json
          --output var/ocr-54-paddle-v5/mobile-report
      - name: Summarize PP-OCRv5 server
        run: >-
          python scripts/ocr_54_summarize_paddle_scale_sweep.py
          --prepared var/ocr-54-paddle-v5/prepared
          --paddle var/ocr-54-paddle-v5/server/paddle-corpus.json
          --output var/ocr-54-paddle-v5/server-report
      - name: Upload PP-OCRv5 comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocr-54-paddle-v5-compare
          path: |
            var/ocr-54-paddle-v5/mobile/paddle-corpus.json
            var/ocr-54-paddle-v5/server/paddle-corpus.json
            var/ocr-54-paddle-v5/mobile-report
            var/ocr-54-paddle-v5/server-report
          if-no-files-found: error
          retention-days: 7
