name: Public Demo Freeze (temporary)

on:
  push:
    branches: [feat/public-demo-corpus-v1]

permissions:
  contents: write

jobs:
  freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: "3.11"
          prune-cache: true

      - name: Install locked dependencies and Chromium
        run: |
          uv sync --frozen
          npm ci
          npx playwright install --with-deps chromium

      - name: Acquire checksum-pinned OFL fonts
        run: uv run python scripts/public_demo/fetch_fonts.py

      - name: Update narrow project notices
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          notices = Path("THIRD_PARTY_NOTICES.md")
          text = notices.read_text(encoding="utf-8")
          marker = "## Give My Regards to Black Jack Test Fixtures"
          section = (
              "## MangaSensei Public Demo Corpus\n\n"
              "The project-owned [`assets/public-demo/`](assets/public-demo/) corpus is "
              "licensed separately under CC BY 4.0. Its SVG artwork, rendered PNG pages "
              "and annotations are original MangaSensei corpus assets; this does not "
              "change the GPL-3.0-only license of MangaSensei source code or the separate "
              "terms of the Black Jack fixtures below.\n\n"
              "The deterministic renderer uses Noto Sans CJK JP `Sans2.004` and Noto "
              "Serif CJK JP `Serif2.003` from the official [`notofonts/noto-cjk`]"
              "(https://github.com/notofonts/noto-cjk) repository under SIL OFL 1.1. "
              "Font binaries are not committed; exact upstream paths, Git blob IDs, byte "
              "sizes and SHA-256 values are recorded in "
              "[`assets/public-demo/provenance/fonts.json`]"
              "(assets/public-demo/provenance/fonts.json) and verified before rendering.\n\n"
          )
          if section not in text:
              if marker not in text:
                  raise SystemExit("Black Jack notice marker not found")
              notices.write_text(text.replace(marker, section + marker, 1), encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          bullet = (
              "- MangaSensei-owned CC BY 4.0 public demo corpus with four original SVG/PNG "
              "pages, pinned OFL Japanese fonts, versioned source-intent ground truth, "
              "provenance/integrity manifests and deterministic render/contract tooling.\n"
          )
          if bullet not in text:
              marker = "### Added\n\n"
              if marker not in text:
                  raise SystemExit("CHANGELOG Added marker not found")
              changelog.write_text(text.replace(marker, marker + bullet, 1), encoding="utf-8")
          PY

      - name: Render twice and require byte-identical canonical PNGs
        run: |
          node scripts/public_demo/render.mjs
          uv run python scripts/public_demo/freeze.py
          sha256sum assets/public-demo/images/*.png | sort > "${RUNNER_TEMP}/first.sha256"
          node scripts/public_demo/render.mjs
          uv run python scripts/public_demo/freeze.py
          sha256sum assets/public-demo/images/*.png | sort > "${RUNNER_TEMP}/second.sha256"
          diff -u "${RUNNER_TEMP}/first.sha256" "${RUNNER_TEMP}/second.sha256"
          cat "${RUNNER_TEMP}/second.sha256"

      - name: Validate frozen corpus contracts
        run: |
          uv run python scripts/public_demo/validate.py
          uv run pytest tests/public_demo -q
          uv run ruff check scripts/public_demo tests/public_demo
          uv run python scripts/check_markdown_links.py

      - name: Upload canonical render review artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-demo-canonical-renders
          path: assets/public-demo/images/*.png
          if-no-files-found: error
          retention-days: 3

      - name: Commit frozen corpus and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/public-demo-freeze-temp.yml
          git add assets/public-demo scripts/public_demo tests/public_demo docs/public-demo-corpus.md THIRD_PARTY_NOTICES.md CHANGELOG.md
          git commit -m "chore(public-demo): freeze canonical renders"
          git push origin HEAD:feat/public-demo-corpus-v1
