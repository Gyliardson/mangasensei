name: OCR 54 Source Context Investigation

on:
  push:
    branches: [investigate/54-warp-boundary]
    paths:
      - ".github/workflows/ocr-54-warp-boundary.yml"
      - "scripts/ocr_54_warp_boundary.py"

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MANGASENSEI_MODEL_CACHE: ${{ github.workspace }}/var/models
      MANGASENSEI_OCR_WARP_ARTIFACT_DIR: ${{ github.workspace }}/var/ocr-54-warp-boundary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: "3.11"
          prune-cache: true
      - run: uv sync --frozen --extra ocr
      - run: uv run mangasensei models download
      - run: uv run mangasensei models verify
      - name: Compare source-context factors on full recognizer batches
        run: uv run python scripts/ocr_54_warp_boundary.py
      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocr-54-source-context-full-batch
          path: var/ocr-54-warp-boundary
          if-no-files-found: error
          retention-days: 7
