name: Media Capture Contract

on:
  pull_request:
    paths:
      - "frontend/playwright.config.ts"
      - "frontend/playwright.media.config.ts"
      - "frontend/e2e/media/**"
      - "scripts/media/**"
      - "docs/media-capture.md"
      - "package.json"
      - "package-lock.json"
      - "frontend/package.json"
      - ".github/workflows/media-contract.yml"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media-contract:
    name: Media contract and representative capture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check media catalog, paths, dry-run derivatives and Playwright discovery boundaries
        run: npm run media:check

      - name: Install pinned Chromium
        run: npx --no-install playwright install --with-deps chromium
        working-directory: frontend

      - name: Generate one representative screenshot and provenance manifest
        env:
          MANGASENSEI_MEDIA_OUTPUT: ${{ runner.temp }}/mangasensei-media-smoke
        run: npm run media:capture -- --project media-desktop --grep '@media-smoke'

      - name: Generate one representative WebM and verify provenance
        env:
          MANGASENSEI_MEDIA_OUTPUT: ${{ runner.temp }}/mangasensei-media-smoke
        run: npm run media:capture -- --project media-desktop --grep '@media-webm-smoke'

      - name: Upload media diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: media-contract-diagnostics
          path: |
            test-results-media
            ${{ runner.temp }}/mangasensei-media-smoke
          if-no-files-found: ignore
