name: Ruff import debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  ruff-import-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: "3.11"
          prune-cache: true
      - name: Install locked development dependencies
        run: uv sync --frozen
      - name: Print Ruff autofix diff
        run: |
          uv run ruff check --fix backend/src/mangasensei/workers/runner.py
          git diff -- backend/src/mangasensei/workers/runner.py
