name: Public Benchmark Contract

on:
  pull_request:
    paths:
      - "assets/public-demo/**"
      - "scripts/public_benchmark/**"
      - "tests/public_benchmark/**"
      - "docs/public-benchmark.md"
      - ".github/workflows/public-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-benchmark:
    name: Deterministic evaluator contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: "3.11"
          prune-cache: true

      - name: Install locked project dependencies without OCR extras
        run: uv sync --frozen

      - name: Lint public benchmark evaluator
        run: uv run ruff check scripts/public_benchmark tests/public_benchmark --output-format=github

      - name: Strict type check public benchmark evaluator
        shell: bash
        run: |
          set +e
          uv run mypy --strict --explicit-package-bases --show-column-numbers scripts/public_benchmark/*.py 2>&1 | tee /tmp/public-benchmark-mypy.log
          status=${PIPESTATUS[0]}
          python - <<'PY'
          from pathlib import Path
          import re

          for line in Path("/tmp/public-benchmark-mypy.log").read_text(encoding="utf-8").splitlines():
              match = re.match(r"^(.*?):(\d+):(\d+): error: (.*)$", line)
              if match:
                  path, line_no, column, message = match.groups()
                  print(f"::error file={path},line={line_no},col={column}::{message}")
                  continue
              match = re.match(r"^(.*?):(\d+): error: (.*)$", line)
              if match:
                  path, line_no, message = match.groups()
                  print(f"::error file={path},line={line_no}::{message}")
          PY
          exit "$status"

      - name: Run public benchmark regression suite
        run: uv run pytest tests/public_benchmark

      - name: Check repository Markdown links
        run: uv run python scripts/check_markdown_links.py
