name: OCR 54 Small Recognizer Audit

on:
  push:
    branches: [investigate/54-ocr-ensemble-benchmark]
    paths:
      - ".github/workflows/ocr-54-small-recognizer.yml"
      - "scripts/ocr_54_run_small_transformers_recognizer.py"
      - "scripts/ocr_54_router_policy_audit.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    name: Evaluate small PP-OCRv6 with conservative router
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HOME: ${{ github.workspace }}/var/hf-small-recognizer
      HF_HUB_DISABLE_TELEMETRY: "1"
      TRANSFORMERS_VERBOSITY: error
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: "3.11"
          prune-cache: true
      - run: uv sync --frozen --extra ocr
      - name: Lint small-recognizer audit scripts
        run: |
          uv run ruff check scripts/ocr_54_run_small_transformers_recognizer.py
          uv run ruff check --ignore E501 scripts/ocr_54_router_policy_audit.py
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ocr-54-router-prepared
          path: var/ocr-54-small/prepared
          github-token: ${{ github.token }}
          run-id: 31332104710
      - name: Install direct Transformers support
        run: uv pip install "transformers==5.14.1" "psutil==7.2.2"
      - name: Run small PP-OCRv6 over all 474 crops
        run: >-
          uv run python scripts/ocr_54_run_small_transformers_recognizer.py
          --input var/ocr-54-small/prepared
          --output var/ocr-54-small/secondary
          --batch-size 1
      - name: Evaluate reviewed routing cases
        run: >-
          uv run python scripts/ocr_54_router_policy_audit.py
          --prepared var/ocr-54-small/prepared
          --paddle var/ocr-54-small/secondary/small-transformers.json
          --output var/ocr-54-small/report
      - name: Upload small-recognizer observations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocr-54-small-recognizer-report
          path: |
            var/ocr-54-small/secondary/small-transformers.json
            var/ocr-54-small/report/router-policy.json
          if-no-files-found: error
          retention-days: 7
