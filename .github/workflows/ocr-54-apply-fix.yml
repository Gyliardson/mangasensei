name: OCR 54 Apply Fix

on:
  pull_request:
    paths:
      - ".github/workflows/ocr-54-apply-fix.yml"

permissions:
  contents: write

concurrency:
  group: ocr-54-apply-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    name: Apply reviewed recognizer patch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Patch recognizer padding and provenance generation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          model_path = Path("backend/src/mangasensei/ocr/vendor/manga_image_translator/manga_translator/ocr/model_48px.py")
          model = model_path.read_text(encoding="utf-8")
          old_model = "            max_width = 4 * (max(widths) + 7) // 4\n"
          new_model = (
              "            # The beam mask treats each crop as ceil(width / 4) + 2 valid features.\n"
              "            # ConvNeXt reduces width by four, so the batch tensor must expose at least\n"
              "            # that many features even for the widest crop in the batch.\n"
              "            max_width = 4 * (((max(widths) + 3) // 4) + 2)\n"
          )
          if model.count(old_model) != 1:
              raise SystemExit("expected exactly one recognizer max_width expression")
          model_path.write_text(model.replace(old_model, new_model), encoding="utf-8")

          adapter_path = Path("backend/src/mangasensei/ocr/adapter/manga_image_translator.py")
          adapter = adapter_path.read_text(encoding="utf-8")
          old_adapter = '_CONFIG_SCHEMA_VERSION = "manga-image-translator-v1"\n'
          new_adapter = '_CONFIG_SCHEMA_VERSION = "manga-image-translator-v2"\n'
          if adapter.count(old_adapter) != 1:
              raise SystemExit("expected exactly one OCR config schema version")
          adapter_path.write_text(adapter.replace(old_adapter, new_adapter), encoding="utf-8")
          PY

      - name: Commit focused production fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/mangasensei/ocr/vendor/manga_image_translator/manga_translator/ocr/model_48px.py \
            backend/src/mangasensei/ocr/adapter/manga_image_translator.py
          git commit -m "fix(ocr): align recognizer padding with feature mask"
          git push origin "HEAD:${HEAD_BRANCH}"
