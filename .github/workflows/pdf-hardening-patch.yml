name: PDF hardening patch

on:
  push:
    branches: [feat/105-hardened-pdf-import]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/105-hardened-pdf-import

      - name: Apply focused backend hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/src/mangasensei/application/pdf_imports.py")
          text = path.read_text()
          replacements = [
              (
                  "import asyncio\nimport hashlib\n",
                  "import asyncio\nimport errno\nimport hashlib\n",
              ),
              (
                  "        except Exception:\n            path.unlink(missing_ok=True)\n            raise\n        finally:\n            os.close(descriptor)\n",
                  "        except OSError as exc:\n            path.unlink(missing_ok=True)\n            if exc.errno == errno.ENOSPC:\n                raise PdfAdmissionError(\n                    \"pdf_temp_storage_exhausted\",\n                    \"temporary PDF storage is exhausted\",\n                ) from exc\n            raise\n        except Exception:\n            path.unlink(missing_ok=True)\n            raise\n        finally:\n            os.close(descriptor)\n",
              ),
              (
                  "        try:\n            images = self._validate_manifest(claim, outcome)\n        except (ImageValidationError, PdfSpoolError, ValidationError, ValueError):\n            await self._terminal_failure(claim, \"pdf_raster_validation_failed\")\n            return\n",
                  "        try:\n            images = self._validate_manifest(claim, outcome)\n        except ImageValidationError:\n            await self._terminal_failure(claim, \"pdf_raster_validation_failed\")\n            return\n        except (PdfSpoolError, ValidationError, ValueError):\n            await self._terminal_failure(claim, \"pdf_manifest_invalid\")\n            return\n",
              ),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f"backend hardening anchor missing: {old[:100]!r}")
          path.write_text(text)
          PY

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: "3.11"
          prune-cache: true

      - name: Verify focused file
        run: |
          uv sync --frozen
          uv run ruff check backend/src/mangasensei/application/pdf_imports.py
          uv run ruff format --check backend/src/mangasensei/application/pdf_imports.py
          uv run mypy backend/src/mangasensei/application/pdf_imports.py

      - name: Commit focused backend hardening
        run: |
          if git diff --quiet -- backend/src/mangasensei/application/pdf_imports.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/mangasensei/application/pdf_imports.py
          git commit -m "fix(pdf): classify import boundary failures"
          git push origin HEAD:feat/105-hardened-pdf-import
