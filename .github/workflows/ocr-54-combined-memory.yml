name: OCR 54 Combined Memory Audit

on:
  push:
    branches: [investigate/54-ocr-ensemble-benchmark]
    paths:
      - ".github/workflows/ocr-54-combined-memory.yml"
      - "scripts/ocr_54_combined_memory_audit.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    name: Measure primary plus gated direct PP-OCRv6
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MANGASENSEI_MODEL_CACHE: ${{ github.workspace }}/var/models
      HF_HOME: ${{ github.workspace }}/var/hf-combined-memory
      HF_HUB_DISABLE_TELEMETRY: "1"
      TRANSFORMERS_VERBOSITY: error
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: "3.11"
          prune-cache: true
      - run: uv sync --frozen --extra ocr
      - name: Lint combined-memory diagnostic
        run: uv run ruff check scripts/ocr_54_combined_memory_audit.py
      - run: uv run mangasensei models download
      - run: uv run mangasensei models verify
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ocr-54-router-prepared
          path: var/ocr-54-combined/prepared
          github-token: ${{ github.token }}
          run-id: 31332104710
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ocr-54-router-paddle
          path: var/ocr-54-combined/reference
          github-token: ${{ github.token }}
          run-id: 31332104710
      - name: Install direct Transformers support in project environment
        run: uv pip install "transformers==5.14.1" "psutil==7.2.2"
      - name: Run combined worker memory audit
        run: >-
          uv run python scripts/ocr_54_combined_memory_audit.py
          --prepared var/ocr-54-combined/prepared
          --reference var/ocr-54-combined/reference/paddle-corpus.json
          --model-cache "$MANGASENSEI_MODEL_CACHE"
          --output var/ocr-54-combined/output
      - name: Upload combined-memory observations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocr-54-combined-memory
          path: var/ocr-54-combined/output/combined-memory.json
          if-no-files-found: error
          retention-days: 7
