name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  contents: write

jobs:
  ocr-smoke:
    name: Real OCR model smoke
    permissions:
      contents: read
    uses: ./.github/workflows/ocr-smoke.yml
    with:
      repeat_runs: 3
      full_corpus: true

  bootstrap-contract:
    name: JMdict and clean Compose contract
    permissions:
      contents: read
    uses: ./.github/workflows/jmdict-contract.yml

  release:
    name: Validate and publish release
    needs: [ocr-smoke, bootstrap-contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: 0.12.3
          python-version: "3.11"
          prune-cache: true

      - name: Validate version mirrors and tag
        run: |
          python scripts/version.py check
          VERSION="$(cat VERSION)"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Require successful CI for tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SUCCESSFUL_RUNS="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success" \
            --jq '.total_count')"
          if [ "${SUCCESSFUL_RUNS}" -lt 1 ]; then
            echo "No successful CI run exists for tagged commit ${GITHUB_SHA}." >&2
            exit 1
          fi

      - name: Require curated changelog entry
        run: python scripts/version.py release-notes > release-notes.md

      - name: Build release distributions
        run: uv build

      - name: Build release image
        run: docker build --build-arg MANGASENSEI_VERSION="$(cat VERSION)" -t "mangasensei:$(cat VERSION)" .

      - name: Verify release image metadata
        run: |
          test "$(docker image inspect "mangasensei:$(cat VERSION)" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$(cat VERSION)"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --title "MangaSensei ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
