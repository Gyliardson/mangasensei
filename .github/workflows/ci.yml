name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest with coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_DB: mangasensei
          POSTGRES_USER: mangasensei
          POSTGRES_PASSWORD: mangasensei
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U mangasensei -d mangasensei"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MANGASENSEI_TEST_DATABASE_URL: postgresql+psycopg://mangasensei:mangasensei@127.0.0.1:55432/mangasensei
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: "3.11"
          prune-cache: true

      - name: Install dependencies from lockfile
        run: uv sync --frozen --extra ocr

      - name: Check version mirrors
        run: uv run python scripts/version.py check

      - name: Check local documentation links
        run: uv run python scripts/check_markdown_links.py

      - name: Lint with Ruff
        run: uv run ruff check backend/src tests scripts

      - name: Type check with mypy
        run: uv run mypy backend/src

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term --cov-report=html

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: htmlcov
          if-no-files-found: ignore

  distribution:
    name: Distribution (wheel build and clean install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: "3.11"
          prune-cache: true

      - name: Build wheel and source distribution
        run: uv build

      - name: Create clean smoke environment
        run: uv venv .package-smoke --python 3.11

      - name: Install built wheel
        run: uv pip install --python .package-smoke/bin/python dist/*.whl

      - name: Verify installed package and packaged data
        run: |
          .package-smoke/bin/python -c "import importlib.resources as r; import mangasensei; import mangasensei.cli; import mangasensei.ocr.models.downloader; import mangasensei.ocr.models.manifest; assert r.files('mangasensei.ocr.models').joinpath('manifest.json').is_file(); print(mangasensei.__version__)"
          .package-smoke/bin/mangasensei --help

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  docker:
    name: Docker (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production image from tracked files
        run: docker build --build-arg MANGASENSEI_VERSION="$(cat VERSION)" -t mangasensei:ci .

      - name: Verify image metadata and package imports
        run: |
          test "$(docker image inspect mangasensei:ci --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$(cat VERSION)"
          docker run --rm --entrypoint python mangasensei:ci -c "import mangasensei; import mangasensei.ocr.models.manifest; print(mangasensei.__version__)"

  frontend:
    name: Frontend (lint, typecheck, coverage, build, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx --no-install playwright install --with-deps chromium
        working-directory: frontend

      - name: End-to-end tests
        run: npm run e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

  security:
    name: Security (secret scan, dependency audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: npm audit (omit dev)
        run: npm ci && npm audit --omit=dev

      - name: Scan for common secrets in tracked files
        run: |
          if rg -n --hidden -g '!/.git' -e 'AIza[0-9A-Za-z_-]{20,}' -e 'ghp_[0-9A-Za-z]{20,}' -e 'sk-[0-9A-Za-z]{20,}' -e 'AKIA[0-9A-Z]{16}' -g '!node_modules' -g '!uv.lock' -g '!package-lock.json' .; then
            echo "Potential secret found in tracked files." >&2
            exit 1
          fi
          echo "No obvious secrets found."
