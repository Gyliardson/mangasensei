name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest with coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_DB: mangasensei
          POSTGRES_USER: mangasensei
          POSTGRES_PASSWORD: mangasensei
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U mangasensei -d mangasensei"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MANGASENSEI_TEST_DATABASE_URL: postgresql+psycopg://mangasensei:mangasensei@127.0.0.1:55432/mangasensei
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.3
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra ocr

      - name: Lint with Ruff
        run: uv run ruff check backend/src tests

      - name: Type check with mypy
        run: uv run mypy backend/src

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term --cov-report=html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: htmlcov
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, typecheck, coverage, build, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx --no-install playwright install --with-deps chromium
        working-directory: frontend

      - name: End-to-end tests
        run: npm run e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

  security:
    name: Security (secret scan, dependency audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: npm audit (omit dev)
        run: npm ci && npm audit --omit=dev

      - name: Scan for common secrets in tracked files
        run: |
          if rg -n --hidden -g '!/.git' -e 'AIza[0-9A-Za-z_-]{20,}' -e 'ghp_[0-9A-Za-z]{20,}' -e 'sk-[0-9A-Za-z]{20,}' -e 'AKIA[0-9A-Z]{16}' -g '!node_modules' -g '!uv.lock' -g '!package-lock.json' .; then
            echo "Potential secret found in tracked files." >&2
            exit 1
          fi
          echo "No obvious secrets found."
