name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest with coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_DB: mangasensei
          POSTGRES_USER: mangasensei
          POSTGRES_PASSWORD: mangasensei
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U mangasensei -d mangasensei"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MANGASENSEI_TEST_DATABASE_URL: postgresql+psycopg://mangasensei:mangasensei@127.0.0.1:55432/mangasensei
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: "3.11"
          prune-cache: true

      - name: Install dependencies from lockfile
        run: uv sync --frozen --extra ocr

      - name: Check version mirrors
        run: uv run python scripts/version.py check

      - name: Check local documentation links
        run: uv run python scripts/check_markdown_links.py

      - name: Lint with Ruff
        run: uv run ruff check backend/src tests scripts

      - name: Type check with mypy
        run: uv run mypy backend/src

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term --cov-report=html

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: htmlcov
          if-no-files-found: ignore

  distribution:
    name: Distribution (wheel build and clean install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: "3.11"
          prune-cache: true

      - name: Build wheel and source distribution
        run: uv build

      - name: Create clean smoke environment
        run: uv venv .package-smoke --python 3.11

      - name: Install built wheel
        run: uv pip install --python .package-smoke/bin/python dist/*.whl

      - name: Verify installed package and packaged data
        run: |
          .package-smoke/bin/python -c "import importlib.resources as r; import mangasensei; import mangasensei.cli; import mangasensei.ocr.models.downloader; import mangasensei.ocr.models.manifest; assert r.files('mangasensei.ocr.models').joinpath('manifest.json').is_file(); print(mangasensei.__version__)"
          .package-smoke/bin/mangasensei --help

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  docker:
    name: Docker (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production image from tracked files
        run: docker build --build-arg MANGASENSEI_VERSION="$(cat VERSION)" -t mangasensei:ci .

      - name: Verify image metadata and package imports
        run: |
          test "$(docker image inspect mangasensei:ci --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$(cat VERSION)"
          docker run --rm --entrypoint python mangasensei:ci -c "import mangasensei; import mangasensei.ocr.models.manifest; print(mangasensei.__version__)"

      - name: Verify service-scoped runtime secrets
        env:
          POSTGRES_PASSWORD: compose-ci-password
          MANGASENSEI_CAPABILITY_PEPPERS: '["compose-ci-pepper-value-0000000000000001"]'
        run: |
          docker compose config --format json > /tmp/mangasensei-compose.json
          python - <<'PY'
          import json
          from pathlib import Path

          compose = json.loads(Path("/tmp/mangasensei-compose.json").read_text(encoding="utf-8"))
          services = compose["services"]
          app_roles = {
              "models",
              "jmdict",
              "migrate",
              "api",
              "pdf-renderer",
              "pdf-importer",
              "worker",
              "retention",
          }
          environment_keys = {
              name: set(services[name].get("environment", {})) for name in app_roles
          }

          expected_secret_consumers = {
              "GOOGLE_API_KEY": {"worker"},
              "MANGASENSEI_CAPABILITY_PEPPERS": {"api", "pdf-importer"},
              "MANGASENSEI_DATABASE_URL": {
                  "migrate", "api", "pdf-importer", "worker", "retention"
              },
          }
          for variable, expected in expected_secret_consumers.items():
              actual = {name for name, keys in environment_keys.items() if variable in keys}
              assert actual == expected, (variable, actual)

          unrelated_secrets = {
              "GOOGLE_API_KEY",
              "MANGASENSEI_CAPABILITY_PEPPERS",
              "MANGASENSEI_DATABASE_URL",
          }
          assert environment_keys["models"].isdisjoint(unrelated_secrets)
          assert environment_keys["jmdict"].isdisjoint(unrelated_secrets)
          assert environment_keys["pdf-renderer"].isdisjoint(unrelated_secrets)
          assert services["worker"]["environment"]["GOOGLE_API_KEY"] == ""
          PY
          docker run --rm -e GOOGLE_API_KEY= --entrypoint python mangasensei:ci -c "from mangasensei.config import Settings; from mangasensei.runtime import _gemini_adapter; settings = Settings(_env_file=None); assert settings.google_api_key is None; assert _gemini_adapter(settings) is None"

      - name: Prove hardened local PDF renderer boundary
        run: |
          container_name=mangasensei-pdf-renderer-ci
          docker rm -f "${container_name}" >/dev/null 2>&1 || true
          docker run --detach --name "${container_name}" \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --memory 1g \
            --cpus 1 \
            --pids-limit 64 \
            --tmpfs /tmp:rw,size=128m,mode=1777 \
            --tmpfs /app/var/pdf-spool:rw,size=1g,mode=0700,uid=10001,gid=10001 \
            -e MANGASENSEI_ENVIRONMENT=test \
            -e MANGASENSEI_PDF_SPOOL_ROOT=/app/var/pdf-spool \
            mangasensei:ci mangasensei pdf-renderer >/dev/null
          for attempt in $(seq 1 30); do
            if docker exec "${container_name}" test -f /app/var/pdf-spool/renderer/heartbeat.json; then
              break
            fi
            sleep 1
          done
          docker exec "${container_name}" python - <<'PY'
          import os
          import socket
          from pathlib import Path
          from mangasensei.pdf_imports.renderer import renderer_provenance

          assert os.getuid() == 10001
          status = Path('/proc/self/status').read_text()
          assert 'NoNewPrivs:\t1' in status
          assert 'CapEff:\t0000000000000000' in status
          provenance = renderer_provenance()
          assert provenance.pypdfium2 == '5.12.1'
          assert provenance.pdfium_build == 7947
          assert provenance.native_library == 'pypdfium2_raw/libpdfium.so'
          Path('/app/var/pdf-spool/ci-write-proof').write_text('ok')
          try:
              Path('/app/ci-root-write-proof').write_text('forbidden')
          except OSError:
              pass
          else:
              raise SystemExit('renderer root filesystem was writable')
          socket.setdefaulttimeout(1)
          try:
              socket.getaddrinfo('pypi.org', 443)
          except OSError:
              pass
          else:
              raise SystemExit('renderer unexpectedly resolved outbound DNS')
          try:
              socket.create_connection(('1.1.1.1', 443), timeout=1)
          except OSError:
              pass
          else:
              raise SystemExit('renderer unexpectedly opened outbound TCP')
          PY
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "${container_name}")" = true
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' "${container_name}")" = none
          test "$(docker inspect --format '{{.HostConfig.Memory}}' "${container_name}")" = 1073741824
          test "$(docker inspect --format '{{.HostConfig.PidsLimit}}' "${container_name}")" = 64
          docker rm -f "${container_name}" >/dev/null

  frontend:
    name: Frontend (lint, typecheck, coverage, build, e2e)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_DB: mangasensei
          POSTGRES_USER: mangasensei
          POSTGRES_PASSWORD: mangasensei
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U mangasensei -d mangasensei"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MANGASENSEI_DATABASE_URL: postgresql+psycopg://mangasensei:mangasensei@127.0.0.1:55432/mangasensei
      MANGASENSEI_STORAGE_ROOT: /tmp/mangasensei-fullstack-storage
      MANGASENSEI_PDF_SPOOL_ROOT: /tmp/mangasensei-pdf-fullstack-spool
      MANGASENSEI_FRONTEND_DIST: frontend/dist
      MANGASENSEI_CAPABILITY_PEPPERS: '["fullstack-e2e-capability-pepper-000000000001"]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx --no-install playwright install --with-deps chromium
        working-directory: frontend

      - name: Mocked browser E2E (desktop/mobile/accessibility)
        run: npm run e2e

      - name: Install uv for full-stack harness
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: "3.11"
          prune-cache: true

      - name: Install backend dependencies for cross-UID full-stack harness
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0755 /opt/mangasensei-ci-python
          UV_PYTHON_INSTALL_DIR=/opt/mangasensei-ci-python uv python install 3.11
          python_bin="$(UV_PYTHON_INSTALL_DIR=/opt/mangasensei-ci-python uv python find 3.11)"
          UV_PYTHON_INSTALL_DIR=/opt/mangasensei-ci-python uv sync --frozen --python "${python_bin}"
          sudo chmod -R a+rX /opt/mangasensei-ci-python
          grep -q "/opt/mangasensei-ci-python" .venv/pyvenv.cfg
          sudo setpriv --reuid=10001 --regid=10001 --clear-groups \
            .venv/bin/python -c 'import encodings; print("cross-uid Python ready")'

      - name: Start real API, isolated PDF renderer, importer and deterministic worker
        run: |
          rm -rf "${MANGASENSEI_STORAGE_ROOT}" "${MANGASENSEI_PDF_SPOOL_ROOT}"
          sudo install -d -o 10001 -g 10001 -m 0700 \
            "${MANGASENSEI_STORAGE_ROOT}" "${MANGASENSEI_PDF_SPOOL_ROOT}"
          uv run mangasensei migrate
          docker build --build-arg MANGASENSEI_VERSION="$(cat VERSION)" -t mangasensei:pdf-fullstack .
          docker rm -f mangasensei-pdf-renderer-e2e >/dev/null 2>&1 || true
          docker run --detach --name mangasensei-pdf-renderer-e2e \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --memory 1g \
            --cpus 1 \
            --pids-limit 64 \
            --tmpfs /tmp:rw,size=128m,mode=1777 \
            --mount "type=bind,src=${MANGASENSEI_PDF_SPOOL_ROOT},dst=/app/var/pdf-spool" \
            -e MANGASENSEI_ENVIRONMENT=test \
            -e MANGASENSEI_PDF_SPOOL_ROOT=/app/var/pdf-spool \
            mangasensei:pdf-fullstack mangasensei pdf-renderer >/dev/null
          sudo --preserve-env=MANGASENSEI_DATABASE_URL,MANGASENSEI_STORAGE_ROOT,MANGASENSEI_PDF_SPOOL_ROOT,MANGASENSEI_FRONTEND_DIST,MANGASENSEI_CAPABILITY_PEPPERS \
            setpriv --reuid=10001 --regid=10001 --clear-groups \
            "${PWD}/.venv/bin/mangasensei" api --host 127.0.0.1 --port 8000 \
            > "${RUNNER_TEMP}/mangasensei-api.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/mangasensei-api.pid"
          sudo --preserve-env=MANGASENSEI_DATABASE_URL,MANGASENSEI_STORAGE_ROOT,MANGASENSEI_PDF_SPOOL_ROOT,MANGASENSEI_FRONTEND_DIST,MANGASENSEI_CAPABILITY_PEPPERS \
            setpriv --reuid=10001 --regid=10001 --clear-groups \
            "${PWD}/.venv/bin/python" tests/fullstack/worker.py \
            > "${RUNNER_TEMP}/mangasensei-worker.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/mangasensei-worker.pid"
          sudo --preserve-env=MANGASENSEI_DATABASE_URL,MANGASENSEI_STORAGE_ROOT,MANGASENSEI_PDF_SPOOL_ROOT,MANGASENSEI_FRONTEND_DIST,MANGASENSEI_CAPABILITY_PEPPERS \
            setpriv --reuid=10001 --regid=10001 --clear-groups \
            "${PWD}/.venv/bin/mangasensei" pdf-importer \
            > "${RUNNER_TEMP}/mangasensei-pdf-importer.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/mangasensei-pdf-importer.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/ready > /dev/null \
              && test -f "${MANGASENSEI_PDF_SPOOL_ROOT}/renderer/heartbeat.json"; then
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/mangasensei-api.log" || true
          cat "${RUNNER_TEMP}/mangasensei-worker.log" || true
          cat "${RUNNER_TEMP}/mangasensei-pdf-importer.log" || true
          docker logs mangasensei-pdf-renderer-e2e || true
          exit 1

      - name: Prove full-stack renderer isolation
        run: |
          test "$(docker exec mangasensei-pdf-renderer-e2e id -u)" = "10001"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' mangasensei-pdf-renderer-e2e)" = "true"
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' mangasensei-pdf-renderer-e2e)" = "none"
          test "$(docker inspect --format '{{.HostConfig.Memory}}' mangasensei-pdf-renderer-e2e)" = "1073741824"
          test "$(docker inspect --format '{{.HostConfig.PidsLimit}}' mangasensei-pdf-renderer-e2e)" = "64"
          docker exec mangasensei-pdf-renderer-e2e python - <<'PY'
          from pathlib import Path

          status = Path("/proc/self/status").read_text()
          assert "NoNewPrivs:\t1" in status
          assert "CapEff:\t0000000000000000" in status
          PY

      - name: Full-stack critical-flow E2E
        run: npm run e2e:fullstack

      - name: Full-stack PDF import through isolated renderer
        run: npx --no-install playwright test --config frontend/playwright.pdf-fullstack.config.ts

      - name: Stop full-stack runtime processes
        if: always()
        run: |
          docker logs mangasensei-pdf-renderer-e2e > "${RUNNER_TEMP}/mangasensei-pdf-renderer.log" 2>&1 || true
          docker rm -f mangasensei-pdf-renderer-e2e >/dev/null 2>&1 || true
          for pid_file in \
            "${RUNNER_TEMP}/mangasensei-api.pid" \
            "${RUNNER_TEMP}/mangasensei-worker.pid" \
            "${RUNNER_TEMP}/mangasensei-pdf-importer.pid"; do
            if test -f "${pid_file}"; then
              sudo kill "$(cat "${pid_file}")" 2>/dev/null || true
            fi
          done

      - name: Upload Playwright and runtime diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            playwright-report-fullstack
            playwright-report-pdf-fullstack
            test-results
            test-results-fullstack
            test-results-pdf-fullstack
            ${{ runner.temp }}/mangasensei-api.log
            ${{ runner.temp }}/mangasensei-worker.log
            ${{ runner.temp }}/mangasensei-pdf-importer.log
            ${{ runner.temp }}/mangasensei-pdf-renderer.log
          if-no-files-found: ignore

  security:
    name: Security (secret scan, dependency audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: npm audit (omit dev)
        run: npm ci && npm audit --omit=dev

      - name: Scan for common secrets in tracked files
        run: |
          if rg -n --hidden -g '!/.git' -e 'AIza[0-9A-Za-z_-]{20,}' -e 'ghp_[0-9A-Za-z]{20,}' -e 'sk-[0-9A-Za-z]{20,}' -e 'AKIA[0-9A-Z]{16}' -g '!node_modules' -g '!uv.lock' -g '!package-lock.json' .; then
            echo "Potential secret found in tracked files." >&2
            exit 1
          fi
          echo "No obvious secrets found."
