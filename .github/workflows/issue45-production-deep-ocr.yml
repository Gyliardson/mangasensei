name: Issue 45 Production Deep OCR

on:
  push:
    branches: ["research/45-panel-reading-order"]
    paths:
      - ".github/workflows/issue45-production-deep-ocr.yml"

permissions:
  contents: read

jobs:
  full-corpus:
    name: Production head full licensed OCR corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MANGASENSEI_MODEL_CACHE: ${{ github.workspace }}/var/models
      MANGASENSEI_RUN_OCR_SMOKE: "1"
      MANGASENSEI_OCR_FULL_CORPUS: "1"
      MANGASENSEI_OCR_REPEAT_RUNS: "1"
    steps:
      - name: Checkout exact production PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: aed1e3a8d4bece69d40d7c06fb569b8b6e4e0a2d

      - name: Assert exact production SHA
        run: test "$(git rev-parse HEAD)" = "aed1e3a8d4bece69d40d7c06fb569b8b6e4e0a2d"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: "3.11"
          prune-cache: true

      - name: Install locked OCR dependencies
        run: uv sync --frozen --extra ocr

      - name: Download reviewed OCR models
        run: uv run mangasensei models download

      - name: Verify reviewed OCR models
        run: uv run mangasensei models verify

      - name: Run full licensed OCR assurance
        run: >-
          uv run pytest
          tests/test_ocr_smoke.py
          tests/test_ocr_real_manga.py
          tests/test_ocr_real_manga_precision.py
          -m ocr_smoke -vv -s --maxfail=1
