name: Issue 45 Panel Order Experiment

on:
  push:
    branches: ["research/45-panel-reading-order"]
    paths:
      - "scripts/issue45_panel_order_experiment.py"
      - "scripts/issue45_panel_order_runner.py"
      - ".github/workflows/issue45-panel-order-experiment.yml"

permissions:
  contents: read

concurrency:
  group: issue-45-panel-order-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experiment:
    name: Deterministic panel-order experiment (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MANGASENSEI_MODEL_CACHE: ${{ github.workspace }}/var/models
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: "3.11"
          prune-cache: true

      - name: Install locked OCR dependencies
        run: uv sync --frozen --extra ocr

      - name: Download reviewed OCR models
        run: uv run mangasensei models download

      - name: Verify reviewed OCR models
        run: uv run mangasensei models verify

      - name: Run sanitized deterministic panel-order experiment
        run: >-
          uv run python scripts/issue45_panel_order_runner.py
          --output var/issue45/summary.json

      - name: Upload sanitized experiment summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue45-panel-order-summary
          path: var/issue45/summary.json
          if-no-files-found: warn
          retention-days: 7
