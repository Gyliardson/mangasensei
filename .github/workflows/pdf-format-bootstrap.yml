name: PDF formatter bootstrap

on:
  push:
    branches: [feat/105-hardened-pdf-import]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/105-hardened-pdf-import

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: "3.11"
          prune-cache: true

      - name: Apply the known non-format Ruff fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("backend/src/mangasensei/application/pdf_imports.py")
          text = path.read_text()
          old = "            destination_dir = self._spool.prepare_import_dir(new_public_id)\n"
          new = "            self._spool.prepare_import_dir(new_public_id)\n"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("known Ruff anchor is missing")
          path.write_text(text)
          PY

      - name: Format touched Python files
        run: |
          uv sync --frozen
          uv run ruff check --fix --exit-zero \
            backend/src/mangasensei/application/pdf_imports.py \
            backend/src/mangasensei/api/pdf_imports.py \
            backend/src/mangasensei/infrastructure/database/document_import_models.py \
            backend/src/mangasensei/pdf_imports \
            backend/src/mangasensei/runtime.py \
            backend/src/mangasensei/cli.py
          uv run ruff format \
            backend/src/mangasensei/application/pdf_imports.py \
            backend/src/mangasensei/api/pdf_imports.py \
            backend/src/mangasensei/infrastructure/database/document_import_models.py \
            backend/src/mangasensei/pdf_imports \
            backend/src/mangasensei/runtime.py \
            backend/src/mangasensei/cli.py
          uv run ruff check \
            backend/src/mangasensei/application/pdf_imports.py \
            backend/src/mangasensei/api/pdf_imports.py \
            backend/src/mangasensei/infrastructure/database/document_import_models.py \
            backend/src/mangasensei/pdf_imports \
            backend/src/mangasensei/runtime.py \
            backend/src/mangasensei/cli.py

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/mangasensei/application/pdf_imports.py \
            backend/src/mangasensei/api/pdf_imports.py \
            backend/src/mangasensei/infrastructure/database/document_import_models.py \
            backend/src/mangasensei/pdf_imports \
            backend/src/mangasensei/runtime.py \
            backend/src/mangasensei/cli.py
          git commit -m "style(pdf): satisfy backend lint"
          git push origin HEAD:feat/105-hardened-pdf-import
