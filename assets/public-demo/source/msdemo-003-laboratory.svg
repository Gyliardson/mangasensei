    <path d="M1218 1070 v170 M1242 1070 v170 M1266 1070 v170 M1290 1070 v170" class="thin"/>
  </g>
  <rect x="990" y="1285" width="265" height="80" fill="#fff" stroke="#111" stroke-width="5"/>
  <g data-region-id="p3-r010"><text class="sans" x="1010" y="1338" font-size="40">試作機B-07</text></g>
  <g data-region-id="p3-r011" transform="rotate(-10 835 1290)"><text class="sans" x="790" y="1310" font-size="54">ピッ</text></g>

  <!-- bottom panel: warning dialogue, ruby and boten -->
  <rect class="panel" x="54" y="1448" width="1332" height="542"/>
  <circle cx="1060" cy="1710" r="120" fill="#fff" stroke="#111" stroke-width="8"/>
  <path d="M950 1690 q45-155 145-122 q82 17 90 110 q-68-38-132-36 q-56 8-103 48" fill="#111"/>
  <path d="M1025 1740 q18 12 36 0 M1095 1740 q18 12 36 0" class="thin"/>
  <ellipse class="bubble" cx="1320" cy="1652" rx="62" ry="125"/>
  <g data-region-id="p3-r009"><text class="serif v" x="1338" y="1618" font-size="42">ん？</text></g>
  <ellipse class="bubble" cx="760" cy="1690" rx="115" ry="245"/>
  <g data-region-id="p3-r006"><text class="serif v" x="792" y="1490" font-size="35">古い装置がまだ動いている。</text></g>
  <g data-region-id="p3-r007"><text class="serif v" x="830" y="1555" font-size="18" letter-spacing="1">そうち</text></g>
  <ellipse class="bubble" cx="350" cy="1690" rx="120" ry="250"/>
  <g data-region-id="p3-r008"><text class="serif v" x="382" y="1500" font-size="35">これは絶対に押さないで。</text></g>
  <g data-presentation-id="p3-pm001">
    <circle cx="421" cy="1615" r="8" fill="#111"/>
    <circle cx="421" cy="1652" r="8" fill="#111"/>
  </g>
  <path d="M70 1930 H1370" class="thin" opacity=".5"/>
