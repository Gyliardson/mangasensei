<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2048" viewBox="0 0 1440 2048" data-page-id="msdemo-003-laboratory">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#efefef"/>
      <path d="M0 0H48V48H0Z" fill="none" stroke="#aaa" stroke-width="2"/>
    </pattern>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(32)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#aaa" stroke-width="3"/>
    </pattern>
    <style>
      .panel{fill:#fff;stroke:#111;stroke-width:10}
      .ink{fill:none;stroke:#111;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .thin{fill:none;stroke:#333;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .bubble{fill:#fff;stroke:#111;stroke-width:6}
      .caption{fill:#fff;stroke:#111;stroke-width:5}
      .serif{font-family:'MangaSensei Serif v1';fill:#111;font-weight:400}
      .sans{font-family:'MangaSensei Sans v1';fill:#111;font-weight:400}
      .v{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:2px}
    </style>
  </defs>
  <rect width="1440" height="2048" fill="#f5f5f3"/>

  <!-- top lab establishing panel -->
  <rect class="panel" x="54" y="54" width="1332" height="610"/>
  <rect x="75" y="75" width="1288" height="568" fill="url(#grid)" opacity=".22"/>
  <rect class="caption" x="88" y="88" width="490" height="94"/>
  <g data-region-id="p3-r001"><text class="serif" x="112" y="150" font-size="40">週末の研究室は静かだった。</text></g>
  <rect x="910" y="110" width="340" height="100" fill="#fff" stroke="#111" stroke-width="6"/>
  <g data-region-id="p3-r002"><text class="sans" x="970" y="176" font-size="52">森博士</text></g>
  <rect x="1040" y="245" width="268" height="84" fill="#111"/>
  <g data-region-id="p3-r003"><text class="sans" x="1090" y="302" font-size="45" style="fill:#fff">研究室</text></g>
  <path d="M120 560 H1320 M200 450 H1220" class="thin"/>
  <path d="M230 360 h260 v150 h-260z M560 330 h270 v180 h-270z" class="ink"/>
  <circle cx="370" cy="435" r="48" fill="#fff" stroke="#111" stroke-width="6"/>
  <path d="M344 438 h52 M370 412 v52" class="thin"/>
  <path d="M610 390 h170 M620 425 h150" class="thin"/>

  <!-- middle left dialogue -->
  <rect class="panel" x="54" y="700" width="650" height="710"/>
  <rect x="76" y="722" width="606" height="666" fill="url(#hatch)" opacity=".12"/>
  <circle cx="330" cy="1115" r="125" fill="#fff" stroke="#111" stroke-width="8"/>
  <path d="M218 1090 q44-160 150-120 q82 20 88 118 q-74-48-150-40 q-48 8-88 42" fill="#111"/>
  <path d="M292 1140 q18 12 36 0 M368 1140 q18 12 36 0" class="thin"/>
