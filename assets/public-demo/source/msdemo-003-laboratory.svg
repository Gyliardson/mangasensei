    <rect x="825" y="1045" width="350" height="220" rx="14" fill="#e8e8e8" stroke="#111" stroke-width="6"/>
    <circle cx="880" cy="1100" r="22" fill="none" stroke="#111" stroke-width="6"/>
    <rect x="930" y="1078" width="44" height="44" fill="none" stroke="#111" stroke-width="6"/>
    <rect x="1010" y="1078" width="44" height="44" fill="none" stroke="#111" stroke-width="6"/>
    <rect x="1020" y="1088" width="24" height="24" fill="none" stroke="#111" stroke-width="4"/>
    <path d="M1085 1080 h48 m-24-22 v44" class="thin"/>
    <circle cx="880" cy="1180" r="22" fill="#111"/>
    <path d="M930 1160 l46 40 M976 1160 l-46 40" class="thin"/>
    <path d="M1030 1160 l42 0 0 42 -42 0z" class="thin"/>
    <path d="M1100 1160 q35 20 0 42 q-35-20 0-42" class="thin"/>
  </g>
