  <g data-region-id="p3-r004"><text class="serif v" x="607" y="720" font-size="34">博士は土曜日も来るの？</text></g>
  <ellipse class="bubble" cx="132" cy="1040" rx="82" ry="300"/>
  <g data-region-id="p3-r005"><text class="serif v" x="158" y="800" font-size="36">ロボット室の入口はこっち。</text></g>

  <!-- middle right equipment and negative controls -->
  <rect class="panel" x="748" y="700" width="638" height="710"/>
  <path d="M790 805 h510 v430 h-510z" class="ink"/>
  <path d="M820 845 h220 v170 h-220z M1080 845 h180 v170 h-180z" class="thin"/>
