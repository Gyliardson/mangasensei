<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2048" viewBox="0 0 1440 2048" data-page-id="msdemo-002-library">
  <defs>
    <pattern id="books" width="52" height="94" patternUnits="userSpaceOnUse">
      <rect x="2" y="4" width="16" height="86" fill="#d7d7d7" stroke="#555" stroke-width="2"/>
      <rect x="20" y="10" width="12" height="80" fill="#ededed" stroke="#555" stroke-width="2"/>
      <rect x="34" y="2" width="15" height="88" fill="#c9c9c9" stroke="#555" stroke-width="2"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#777"/></pattern>
    <style>
      .panel{fill:#fff;stroke:#111;stroke-width:10}
      .ink{fill:none;stroke:#111;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .thin{fill:none;stroke:#333;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .bubble{fill:#fff;stroke:#111;stroke-width:6}
      .caption{fill:#fff;stroke:#111;stroke-width:5}
      .serif{font-family:'MangaSensei Serif v1';fill:#111;font-weight:400}
      .sans{font-family:'MangaSensei Sans v1';fill:#111;font-weight:400}
      .v{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:2px}
    </style>
  </defs>
  <rect width="1440" height="2048" fill="#f5f5f3"/>

  <!-- upper left: panel 2 in manga order -->
  <rect class="panel" x="54" y="54" width="650" height="892"/>
  <rect x="76" y="76" width="270" height="820" fill="url(#books)" opacity=".8"/>
  <path d="M370 670 H670 M370 790 H670" class="thin"/>
  <rect x="390" y="712" width="214" height="74" fill="#fff" stroke="#111" stroke-width="5"/>
  <g data-region-id="p2-r004"><text class="sans" x="416" y="765" font-size="44">返却口</text></g>
  <circle cx="490" cy="455" r="100" fill="#fff" stroke="#111" stroke-width="7"/>
  <path d="M402 442 q38-136 142-88 q70 25 66 110 q-72-48-158-37" fill="#111"/>
  <path d="M462 475 q17 12 34 0 M520 475 q17 12 34 0" class="thin"/>
  <ellipse class="bubble" cx="584" cy="215" rx="82" ry="118"/>
  <g data-region-id="p2-r003"><text class="serif v" x="606" y="170" font-size="46">え？</text></g>
  <ellipse class="bubble" cx="520" cy="720" rx="122" ry="205"/>
  <g data-region-id="p2-r005"><text class="serif v" x="555" y="540" font-size="28">昨日、机の下で拾ったんだ。</text></g>
  <path d="M438 642 q75 55 145 0" class="thin"/>

  <!-- upper right: panel 1 in manga order -->
  <rect class="panel" x="748" y="54" width="638" height="892"/>
  <rect x="765" y="72" width="605" height="856" fill="url(#dots)" opacity=".10"/>
  <rect class="caption" x="784" y="84" width="350" height="92"/>
  <g data-region-id="p2-r001"><text class="serif" x="808" y="145" font-size="40">放課後、図書室。</text></g>
  <path d="M785 720 H1350 M820 630 H1320" class="thin"/>
  <circle cx="1045" cy="472" r="118" fill="#fff" stroke="#111" stroke-width="8"/>
  <path d="M942 455 q20-135 125-127 q88 3 104 118 q-54-51-118-58 q-63 14-111 67" fill="#111"/>
  <path d="M1012 493 q18 12 38 0 M1080 493 q18 12 38 0 M1030 545 q35 18 68-2" class="thin"/>
  <ellipse class="bubble" cx="1260" cy="340" rx="102" ry="245"/>
  <g data-region-id="p2-r002"><text class="serif v" x="1294" y="175" font-size="37">このメモ、見覚えある？</text></g>
  <path d="M865 715 l250 0 60 120 -326 0 z" fill="#fff" stroke="#111" stroke-width="6"/>
  <g data-region-id="p2-r006"><text class="sans" x="930" y="785" font-size="48">青い鍵</text></g>

  <!-- lower left: panel 4 -->
  <rect class="panel" x="54" y="990" width="650" height="1000"/>
  <rect x="76" y="1012" width="606" height="950" fill="url(#books)" opacity=".26"/>
  <rect x="120" y="1070" width="234" height="90" fill="#fff" stroke="#111" stroke-width="5"/>
  <g data-region-id="p2-r009"><text class="sans" x="142" y="1130" font-size="44">資料室</text></g>
  <circle cx="332" cy="1500" r="120" fill="#fff" stroke="#111" stroke-width="8"/>
  <path d="M225 1472 q48-156 148-120 q79 12 87 115 q-68-38-135-38 q-55 6-100 43" fill="#111"/>
  <path d="M290 1512 q18 12 36 0 M362 1512 q18 12 36 0" class="thin"/>
  <ellipse class="bubble" cx="566" cy="1290" rx="112" ry="245"/>
  <g data-region-id="p2-r011"><text class="serif v" x="600" y="1110" font-size="36">じゃあ、行ってみよう。</text></g>
  <ellipse class="bubble" cx="135" cy="1530" rx="96" ry="360"/>
  <g data-region-id="p2-r012"><text class="serif v" x="165" y="1190" font-size="34">急ごう。閉館まであと10分しかない。</text></g>
  <rect x="390" y="1774" width="220" height="105" fill="#111" rx="8"/>
  <g data-region-id="p2-r013"><text class="sans" x="430" y="1842" font-size="48" style="fill:#fff">18:50</text></g>

  <!-- lower right: panel 3 -->
  <rect class="panel" x="748" y="990" width="638" height="1000"/>
  <path d="M780 1750 H1350 M790 1850 H1340" class="thin"/>
  <rect x="800" y="1030" width="520" height="280" fill="url(#books)" opacity=".75"/>
  <circle cx="1110" cy="1510" r="118" fill="#fff" stroke="#111" stroke-width="8"/>
  <path d="M1002 1490 q48-150 152-116 q80 18 88 113 q-70-40-130-40 q-60 5-110 43" fill="#111"/>
  <path d="M1075 1530 q18 12 36 0 M1144 1530 q18 12 36 0" class="thin"/>
  <ellipse class="bubble" cx="1290" cy="1270" rx="82" ry="285"/>
  <g data-region-id="p2-r007"><text class="serif v" x="1315" y="1040" font-size="38">「青い鍵」って書いてある。</text></g>
  <ellipse class="bubble" cx="850" cy="1440" rx="88" ry="285"/>
  <g data-region-id="p2-r008"><text class="serif v" x="878" y="1210" font-size="36">鍵なら資料室の前で見たよ。</text></g>
  <g data-region-id="p2-r010" transform="rotate(-14 1190 1770)"><text class="sans" x="1132" y="1784" font-size="56">カチッ</text></g>
  <path d="M1220 1695 l70 28 -60 34" class="ink"/>
</svg>
