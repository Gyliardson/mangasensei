<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2048" viewBox="0 0 1440 2048" data-page-id="msdemo-004-rain">
  <defs>
    <pattern id="rain" width="44" height="78" patternUnits="userSpaceOnUse" patternTransform="rotate(16)">
      <line x1="12" y1="0" x2="12" y2="52" stroke="#8c8c8c" stroke-width="3"/>
      <line x1="34" y1="18" x2="34" y2="76" stroke="#b0b0b0" stroke-width="2"/>
    </pattern>
    <pattern id="checker" width="34" height="34" patternUnits="userSpaceOnUse">
      <rect width="17" height="17" fill="#bbb"/><rect x="17" y="17" width="17" height="17" fill="#bbb"/>
    </pattern>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.5" fill="#777"/></pattern>
    <style>
      .panel{fill:#fff;stroke:#111;stroke-width:10}
      .ink{fill:none;stroke:#111;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
      .thin{fill:none;stroke:#333;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .bubble{fill:#fff;stroke:#111;stroke-width:6}
      .thought{fill:#fff;stroke:#111;stroke-width:5;stroke-dasharray:9 6}
      .caption{fill:#fff;stroke:#111;stroke-width:5}
      .serif{font-family:'MangaSensei Serif v1';fill:#111;font-weight:400}
      .sans{font-family:'MangaSensei Sans v1';fill:#111;font-weight:400}
      .v{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:2px}
    </style>
  </defs>
  <rect width="1440" height="2048" fill="#f5f5f3"/>

  <!-- top atmospheric panel -->
  <rect class="panel" x="54" y="54" width="1332" height="620"/>
  <rect x="70" y="70" width="1300" height="588" fill="url(#rain)" data-negative-id="p4-n001-rain-streaks"/>
  <path d="M90 600 L620 280 L1360 430 M180 620 L700 350 L1340 500" class="thin"/>
  <path d="M960 190 h330 v210 h-330z M995 230 h120 v85 h-120z M1150 230 h105 v85 h-105z" class="ink"/>
  <path d="M930 400 h390 l-55 95 h-390z" fill="url(#checker)" stroke="#111" stroke-width="6" data-negative-id="p4-n002-awning-checker"/>
  <rect x="1015" y="322" width="120" height="62" fill="#fff" stroke="#111" stroke-width="4"/>
  <g data-region-id="p4-r007"><text class="sans" x="1038" y="365" font-size="35">喫茶</text></g>
  <rect x="1150" y="322" width="150" height="62" fill="#fff" stroke="#111" stroke-width="4"/>
  <g data-region-id="p4-r008"><text class="sans" x="1170" y="365" font-size="35">月灯り</text></g>
  <g data-region-id="p4-r001" transform="rotate(-12 260 230)"><text class="sans" x="120" y="260" font-size="88">ザアア…</text></g>
  <rect class="caption" x="82" y="504" width="520" height="92"/>
  <g data-region-id="p4-r002"><text class="serif" x="108" y="566" font-size="40">雨脚が強くなってきた。</text></g>

  <!-- middle right panel -->
  <rect class="panel" x="748" y="716" width="638" height="670"/>
  <rect x="765" y="732" width="605" height="638" fill="url(#dots)" opacity=".12"/>
  <path d="M820 1320 q210-340 430 0" class="ink" data-negative-id="p4-n003-umbrella-ribs"/>
  <path d="M1034 1002 v320 M1034 1005 q-130 100-205 305 M1034 1005 q130 100 205 305" class="thin"/>
  <circle cx="1080" cy="1125" r="100" fill="#fff" stroke="#111" stroke-width="7"/>
  <path d="M990 1100 q45-120 132-85 q60 18 66 92 q-64-38-125-30 q-38 4-73 23" fill="#111"/>
  <ellipse class="bubble" cx="1280" cy="880" rx="88" ry="210"/>
  <g data-region-id="p4-r003"><text class="serif v" x="1308" y="740" font-size="36">傘、一本しかないね。</text></g>
  <ellipse class="thought" cx="855" cy="1010" rx="82" ry="200"/>
  <circle cx="930" cy="1165" r="12" fill="#fff" stroke="#111" stroke-width="4"/><circle cx="953" cy="1194" r="7" fill="#fff" stroke="#111" stroke-width="3"/>
  <g data-region-id="p4-r004"><text class="serif v" x="880" y="855" font-size="36">雨、やまないかな。</text></g>

  <!-- middle left panel -->
  <rect class="panel" x="54" y="716" width="650" height="670"/>
  <path d="M70 1250 H690 M110 1160 H650" class="thin"/>
  <circle cx="340" cy="1100" r="108" fill="#fff" stroke="#111" stroke-width="8"/>
  <path d="M242 1078 q44-136 132-105 q73 17 80 101 q-64-40-130-34 q-44 7-82 38" fill="#111"/>
  <ellipse class="bubble" cx="572" cy="900" rx="100" ry="190"/>
  <g data-region-id="p4-r005"><text class="serif v" x="600" y="745" font-size="36">半分こして行こう。</text></g>
  <ellipse class="bubble" cx="132" cy="1040" rx="78" ry="104"/>
  <g data-region-id="p4-r006"><text class="serif v" x="152" y="997" font-size="42">わっ</text></g>
  <rect x="385" y="1190" width="275" height="72" fill="#fff" stroke="#111" stroke-width="5"/>
  <g data-region-id="p4-r009"><text class="sans" x="400" y="1238" font-size="29">本日20:00まで営業</text></g>
  <rect x="110" y="1210" width="150" height="66" fill="#111"/>
  <g data-region-id="p4-r010"><text class="sans" x="145" y="1256" font-size="34" style="fill:#fff">入口</text></g>

  <!-- bottom movement panel -->
  <rect class="panel" x="54" y="1428" width="1332" height="562"/>
  <rect x="70" y="1444" width="1300" height="530" fill="url(#rain)" opacity=".65"/>
  <path d="M75 1920 L610 1560 L1365 1650 M110 1970 L680 1610 L1360 1710" class="thin"/>
  <path d="M690 1870 q220-330 450 0" class="ink"/>
  <path d="M915 1630 v260" class="thin"/>
  <path d="M805 1780 q105-110 210 0 M830 1830 q85-80 165 0" class="thin"/>
  <ellipse class="bubble" cx="1280" cy="1690" rx="92" ry="250"/>
  <g data-region-id="p4-r011"><text class="serif v" x="1310" y="1460" font-size="35">商店街を抜ければ近道だよ。</text></g>
  <ellipse class="bubble" cx="190" cy="1625" rx="90" ry="145"/>
  <g data-region-id="p4-r012"><text class="serif v" x="218" y="1530" font-size="42">急ごう！</text></g>
  <path d="M460 1835 q80-90 150 0 M440 1880 q95-88 180 0" class="ink"/>
</svg>
